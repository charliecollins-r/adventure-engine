<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <defs>
    <marker id="aGold" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#c0a030"/></marker>
    <marker id="aGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#44cc44"/></marker>
    <marker id="aRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#cc6644"/></marker>
  </defs>
  <rect width="900" height="620" fill="#0d0d0a"/>
  <text x="400" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#c0a030" letter-spacing="3">INTERACTION RESOLUTION</text>

  <!-- Player Action -->
  <rect x="290" y="52" width="220" height="44" rx="22" fill="#1a1510" stroke="#c0a030" stroke-width="2"/>
  <text x="400" y="79" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#e0d0a0">Player Action</text>
  <line x1="400" y1="96" x2="400" y2="125" stroke="#c0a030" stroke-width="2" marker-end="url(#aGold)"/>

  <!-- Find Object -->
  <rect x="310" y="130" width="180" height="38" rx="4" fill="#151210" stroke="#2a2018" stroke-width="1.5"/>
  <text x="400" y="154" text-anchor="middle" font-family="monospace" font-size="11" fill="#e0d0a0">Find Object in View</text>
  <line x1="400" y1="168" x2="400" y2="195" stroke="#c0a030" stroke-width="2" marker-end="url(#aGold)"/>

  <!-- Match Interaction -->
  <rect x="290" y="200" width="220" height="50" rx="4" fill="#151210" stroke="#2a2018" stroke-width="1.5"/>
  <text x="400" y="222" text-anchor="middle" font-family="monospace" font-size="11" fill="#e0d0a0">Match Interaction</text>
  <text x="400" y="238" text-anchor="middle" font-family="monospace" font-size="9" fill="#5a4a30">filter by verb, then item</text>
  <line x1="400" y1="250" x2="400" y2="278" stroke="#c0a030" stroke-width="2" marker-end="url(#aGold)"/>

  <!-- Evaluate Conditions -->
  <rect x="290" y="283" width="220" height="50" rx="4" fill="#151210" stroke="#2a2018" stroke-width="1.5"/>
  <text x="400" y="305" text-anchor="middle" font-family="monospace" font-size="11" fill="#e0d0a0">Evaluate Conditions</text>
  <text x="400" y="321" text-anchor="middle" font-family="monospace" font-size="9" fill="#5a4a30">all when[] must be true</text>
  <line x1="400" y1="333" x2="400" y2="363" stroke="#c0a030" stroke-width="2" marker-end="url(#aGold)"/>

  <!-- Diamond -->
  <polygon points="400,368 470,403 400,438 330,403" fill="#1a1510" stroke="#c0a030" stroke-width="2"/>
  <text x="400" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#e0d0a0">Match</text>
  <text x="400" y="414" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#e0d0a0">Found?</text>

  <!-- Yes path -->
  <line x1="330" y1="403" x2="210" y2="403" stroke="#44cc44" stroke-width="2" marker-end="url(#aGreen)"/>
  <text x="270" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#44cc44">Yes</text>
  <rect x="60" y="383" width="150" height="40" rx="4" fill="#151210" stroke="#44cc44" stroke-width="1.5"/>
  <text x="135" y="407" text-anchor="middle" font-family="monospace" font-size="11" fill="#44cc44">Apply Effects</text>
  <line x1="135" y1="423" x2="135" y2="458" stroke="#44cc44" stroke-width="2" marker-end="url(#aGreen)"/>
  <rect x="40" y="463" width="190" height="90" rx="4" fill="#151210" stroke="#2a2018" stroke-width="1"/>
  <text x="135" y="483" text-anchor="middle" font-family="monospace" font-size="9" fill="#8a7a5a">Execute then[] array:</text>
  <text x="135" y="499" text-anchor="middle" font-family="monospace" font-size="9" fill="#e0d0a0">messages, state changes,</text>
  <text x="135" y="513" text-anchor="middle" font-family="monospace" font-size="9" fill="#e0d0a0">items, view navigation,</text>
  <text x="135" y="527" text-anchor="middle" font-family="monospace" font-size="9" fill="#e0d0a0">noise, game_over...</text>
  <text x="135" y="543" text-anchor="middle" font-family="monospace" font-size="9" fill="#5a4a30">+ add interaction noise</text>
  <line x1="230" y1="508" x2="315" y2="508" stroke="#44cc44" stroke-width="2" marker-end="url(#aGreen)"/>

  <!-- Check Win/Lose -->
  <rect x="320" y="488" width="160" height="40" rx="4" fill="#151210" stroke="#2a2018" stroke-width="1.5"/>
  <text x="400" y="512" text-anchor="middle" font-family="monospace" font-size="11" fill="#e0d0a0">Check Win/Lose</text>
  <line x1="400" y1="528" x2="400" y2="560" stroke="#c0a030" stroke-width="2" marker-end="url(#aGold)"/>
  <rect x="310" y="565" width="180" height="38" rx="19" fill="#1a1510" stroke="#c0a030" stroke-width="2"/>
  <text x="400" y="589" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#e0d0a0">Update UI</text>

  <!-- No path -->
  <line x1="470" y1="403" x2="560" y2="403" stroke="#cc6644" stroke-width="2" marker-end="url(#aRed)"/>
  <text x="515" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#cc6644">No</text>
  <rect x="565" y="383" width="180" height="50" rx="4" fill="#151210" stroke="#cc6644" stroke-width="1.5"/>
  <text x="655" y="405" text-anchor="middle" font-family="monospace" font-size="11" fill="#cc6644">Default Response</text>
  <text x="655" y="421" text-anchor="middle" font-family="monospace" font-size="9" fill="#5a4a30">look: description</text>
  <line x1="655" y1="433" x2="655" y2="460" stroke="#cc6644" stroke-width="2"/>
  <line x1="655" y1="460" x2="400" y2="460" stroke="#cc6644" stroke-width="2"/>
  <line x1="400" y1="460" x2="400" y2="483" stroke="#c0a030" stroke-width="2" marker-end="url(#aGold)"/>

  <!-- Five Verbs -->
  <rect x="630" y="60" width="250" height="190" rx="4" fill="#151210" stroke="#2a2018" stroke-width="1.5"/>
  <text x="755" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#c0a030">The Five Verbs</text>
  <line x1="650" y1="94" x2="860" y2="94" stroke="#2a2018" stroke-width="1"/>
  <rect x="650" y="106" width="60" height="22" rx="3" fill="#1a1510" stroke="#3a2a18" stroke-width="1"/>
  <text x="680" y="121" text-anchor="middle" font-family="monospace" font-size="10" fill="#e0d0a0">look</text>
  <text x="720" y="121" font-family="monospace" font-size="9" fill="#5a4a30">Examine visually</text>
  <rect x="650" y="134" width="60" height="22" rx="3" fill="#1a1510" stroke="#3a2a18" stroke-width="1"/>
  <text x="680" y="149" text-anchor="middle" font-family="monospace" font-size="10" fill="#e0d0a0">hand</text>
  <text x="720" y="149" font-family="monospace" font-size="9" fill="#5a4a30">Physical manipulation</text>
  <rect x="650" y="162" width="60" height="22" rx="3" fill="#1a1510" stroke="#3a2a18" stroke-width="1"/>
  <text x="680" y="177" text-anchor="middle" font-family="monospace" font-size="10" fill="#e0d0a0">take</text>
  <text x="720" y="177" font-family="monospace" font-size="9" fill="#5a4a30">Pick up item</text>
  <rect x="650" y="190" width="60" height="22" rx="3" fill="#1a1510" stroke="#3a2a18" stroke-width="1"/>
  <text x="680" y="205" text-anchor="middle" font-family="monospace" font-size="10" fill="#e0d0a0">talk</text>
  <text x="720" y="205" font-family="monospace" font-size="9" fill="#5a4a30">Speak, listen, read</text>
  <rect x="650" y="218" width="60" height="22" rx="3" fill="#1a1510" stroke="#3a2a18" stroke-width="1"/>
  <text x="680" y="233" text-anchor="middle" font-family="monospace" font-size="10" fill="#e0d0a0">use</text>
  <text x="720" y="233" font-family="monospace" font-size="9" fill="#5a4a30">Apply item to object</text>
</svg>