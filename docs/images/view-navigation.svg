<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <defs>
    <marker id="vGold" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#c0a030"/></marker>
    <marker id="vGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#44cc44"/></marker>
  </defs>
  <rect width="900" height="560" fill="#0d0d0a"/>
  <text x="450" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#c0a030" letter-spacing="3">VIEW NAVIGATION &amp; COORDINATE SYSTEM</text>

  <!-- View Stack -->
  <rect x="20" y="60" width="380" height="310" rx="4" fill="#151210" stroke="#2a2018" stroke-width="1.5"/>
  <text x="210" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c0a030">View Stack</text>
  <text x="210" y="104" text-anchor="middle" font-family="monospace" font-size="10" fill="#5a4a30">viewHistory[] — push on enter, pop on back</text>
  <line x1="40" y1="114" x2="380" y2="114" stroke="#2a2018" stroke-width="1"/>

  <!-- Stack visual -->
  <rect x="80" y="130" width="240" height="36" rx="4" fill="#1a1510" stroke="#c0a030" stroke-width="2"/>
  <text x="200" y="153" text-anchor="middle" font-family="monospace" font-size="12" fill="#c0a030">desk_closeup</text>
  <text x="340" y="153" font-family="monospace" font-size="10" fill="#44cc44">← TOP</text>

  <rect x="80" y="176" width="240" height="36" rx="4" fill="#1a1510" stroke="#3a2a18" stroke-width="1.5"/>
  <text x="200" y="199" text-anchor="middle" font-family="monospace" font-size="12" fill="#e0d0a0">office</text>

  <rect x="80" y="222" width="240" height="36" rx="4" fill="#1a1510" stroke="#3a2a18" stroke-width="1.5"/>
  <text x="200" y="245" text-anchor="middle" font-family="monospace" font-size="12" fill="#e0d0a0">hallway</text>

  <rect x="80" y="268" width="240" height="36" rx="4" fill="#1a1510" stroke="#3a2a18" stroke-width="1"/>
  <text x="200" y="291" text-anchor="middle" font-family="monospace" font-size="12" fill="#8a7a5a">main_room</text>
  <text x="340" y="291" font-family="monospace" font-size="10" fill="#8a7a5a">BOTTOM</text>

  <!-- Push/Pop arrows -->
  <line x1="55" y1="290" x2="55" y2="140" stroke="#44cc44" stroke-width="2" marker-end="url(#vGreen)"/>
  <text x="48" y="215" text-anchor="end" font-family="monospace" font-size="10" fill="#44cc44" transform="rotate(-90,48,215)">set_view (push)</text>

  <line x1="345" y1="140" x2="345" y2="180" stroke="#c0a030" stroke-width="2" marker-end="url(#vGold)"/>
  <text x="370" y="165" font-family="monospace" font-size="10" fill="#c0a030">back (pop)</text>

  <!-- Navigation rules -->
  <text x="40" y="330" font-family="monospace" font-size="10" fill="#8a7a5a">set_view effect → push new view on top</text>
  <text x="40" y="348" font-family="monospace" font-size="10" fill="#8a7a5a">navigateBack() → pop current, return to prev</text>
  <text x="40" y="366" font-family="monospace" font-size="10" fill="#8a7a5a">Back button shown if viewHistory.length > 1</text>

  <!-- Coordinate System -->
  <rect x="430" y="60" width="450" height="310" rx="4" fill="#151210" stroke="#2a2018" stroke-width="1.5"/>
  <text x="655" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c0a030">Coordinate System</text>
  <line x1="450" y1="96" x2="860" y2="96" stroke="#2a2018" stroke-width="1"/>

  <!-- JSON space -->
  <rect x="460" y="110" width="192" height="144" rx="3" fill="#1a1510" stroke="#c0a030" stroke-width="1.5"/>
  <text x="556" y="128" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0a030">JSON Space</text>
  <text x="556" y="144" text-anchor="middle" font-family="monospace" font-size="10" fill="#e0d0a0">960 × 720</text>
  <text x="466" y="118" font-family="monospace" font-size="8" fill="#5a4a30">(0,0)</text>
  <text x="618" y="252" font-family="monospace" font-size="8" fill="#5a4a30">(960,720)</text>
  <!-- Grid lines -->
  <line x1="460" y1="182" x2="652" y2="182" stroke="#2a2018" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="556" y1="110" x2="556" y2="254" stroke="#2a2018" stroke-width="0.5" stroke-dasharray="4,4"/>
  <!-- Sample hotspot -->
  <rect x="510" y="160" width="60" height="40" rx="2" fill="none" stroke="#44cc44" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="540" y="184" text-anchor="middle" font-family="monospace" font-size="7" fill="#44cc44">object</text>

  <!-- Arrow between -->
  <line x1="660" y1="182" x2="700" y2="182" stroke="#c0a030" stroke-width="2" marker-end="url(#vGold)"/>
  <text x="680" y="172" text-anchor="middle" font-family="monospace" font-size="8" fill="#8a7a5a">scale</text>

  <!-- Render space -->
  <rect x="710" y="128" width="144" height="108" rx="3" fill="#1a1510" stroke="#44cc44" stroke-width="1.5"/>
  <text x="782" y="148" text-anchor="middle" font-family="monospace" font-size="11" fill="#44cc44">Viewport</text>
  <text x="782" y="164" text-anchor="middle" font-family="monospace" font-size="10" fill="#e0d0a0">960 × 540</text>
  <!-- Sample hotspot scaled -->
  <rect x="748" y="148" width="60" height="30" rx="2" fill="none" stroke="#44cc44" stroke-width="1"/>
  <text x="778" y="167" text-anchor="middle" font-family="monospace" font-size="7" fill="#44cc44">object</text>

  <!-- Scale factors -->
  <text x="460" y="282" font-family="monospace" font-size="10" fill="#e0d0a0">SCALE_X = 1.0</text>
  <text x="460" y="300" font-family="monospace" font-size="10" fill="#e0d0a0">SCALE_Y = 540/720 = 0.75</text>
  <text x="460" y="324" font-family="monospace" font-size="10" fill="#8a7a5a">render_x = json_x × 1.0</text>
  <text x="460" y="342" font-family="monospace" font-size="10" fill="#8a7a5a">render_y = json_y × 0.75</text>
  <text x="460" y="362" font-family="monospace" font-size="10" fill="#8a7a5a">width stays, height × 0.75</text>

  <!-- Background images note -->
  <rect x="20" y="390" width="860" height="150" rx="4" fill="#151210" stroke="#2a2018" stroke-width="1.5"/>
  <text x="450" y="416" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#c0a030">Background Image Pipeline</text>
  <line x1="40" y1="425" x2="860" y2="425" stroke="#2a2018" stroke-width="1"/>

  <!-- Pipeline boxes -->
  <rect x="50" y="440" width="150" height="44" rx="4" fill="#1a1510" stroke="#3a2a18" stroke-width="1"/>
  <text x="125" y="458" text-anchor="middle" font-family="monospace" font-size="10" fill="#e0d0a0">Background Art</text>
  <text x="125" y="474" text-anchor="middle" font-family="monospace" font-size="9" fill="#5a4a30">1920×1080 (any)</text>

  <line x1="200" y1="462" x2="240" y2="462" stroke="#c0a030" stroke-width="2" marker-end="url(#vGold)"/>

  <rect x="245" y="440" width="150" height="44" rx="4" fill="#1a1510" stroke="#3a2a18" stroke-width="1"/>
  <text x="320" y="458" text-anchor="middle" font-family="monospace" font-size="10" fill="#e0d0a0">CSS background-size</text>
  <text x="320" y="474" text-anchor="middle" font-family="monospace" font-size="9" fill="#5a4a30">cover / contain</text>

  <line x1="395" y1="462" x2="435" y2="462" stroke="#c0a030" stroke-width="2" marker-end="url(#vGold)"/>

  <rect x="440" y="440" width="150" height="44" rx="4" fill="#1a1510" stroke="#3a2a18" stroke-width="1"/>
  <text x="515" y="458" text-anchor="middle" font-family="monospace" font-size="10" fill="#e0d0a0">960×540 Viewport</text>
  <text x="515" y="474" text-anchor="middle" font-family="monospace" font-size="9" fill="#5a4a30">render area</text>

  <line x1="590" y1="462" x2="630" y2="462" stroke="#c0a030" stroke-width="2" marker-end="url(#vGold)"/>

  <rect x="635" y="440" width="220" height="44" rx="4" fill="#1a1510" stroke="#3a2a18" stroke-width="1"/>
  <text x="745" y="458" text-anchor="middle" font-family="monospace" font-size="10" fill="#e0d0a0">Object Hotspots Overlay</text>
  <text x="745" y="474" text-anchor="middle" font-family="monospace" font-size="9" fill="#5a4a30">positioned divs, gold border on hover</text>

  <text x="450" y="510" text-anchor="middle" font-family="monospace" font-size="10" fill="#8a7a5a">Objects are transparent until hovered — player discovers them by mousing over the painted background</text>
  <text x="450" y="528" text-anchor="middle" font-family="monospace" font-size="10" fill="#5a4a30">Positions in JSON are top-left coordinates (hotspot box starts at that corner)</text>
</svg>