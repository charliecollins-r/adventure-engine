<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Editor — Adventure Engine</title>
<style>
  :root {
    --gold: #c0a030;
    --gold-dim: #6a5a3a;
    --bg: #0d0d0a;
    --panel: #151210;
    --border: #2a2018;
    --text: #e0d0a0;
    --text-dim: #8a7a5a;
    --accent-nav: #4488cc;
    --accent-obj: #c0a030;
    --accent-char: #44cc66;
    --accent-new: #cc4444;
    --accent-sprite: #cc88ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 13px;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .toolbar label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  /* Floor (walk_area) editor */
  .floor-svg { position: absolute; left: 0; top: 0; width: 960px; height: 540px; z-index: 50; pointer-events: none; }
  .floor-svg.editing { pointer-events: auto; cursor: crosshair; }
  .floor-svg circle { cursor: move; }
  #floorPanel h4 { margin: 12px 0 6px; font-size: 12px; color: #c0a030; text-transform: uppercase; letter-spacing: .06em; }
  #floorPanel p { margin: 4px 0; font-size: 12px; color: #aab; line-height: 1.45; }
  #floorPanel button { background: #2a2a3a; color: #dde; border: 1px solid #445; border-radius: 4px; padding: 4px 8px; margin: 2px 4px 2px 0; font-size: 12px; cursor: pointer; }
  #floorPanel button.on { border-color: #22d3ee; color: #22d3ee; }
  #floorPanel .fp-warn { color: #f87171; }
  #floorPanel .fp-ok { color: #4ade80; }
  #floorPanel input[type=number] { width: 64px; background: #1a1a26; color: #dde; border: 1px solid #445; border-radius: 3px; padding: 2px 4px; }
  .floor-ghost { position: absolute; pointer-events: none; z-index: 60; image-rendering: pixelated; background-repeat: no-repeat; }
  .floor-ghost.off { filter: sepia(1) saturate(8) hue-rotate(-40deg) brightness(0.9); opacity: 0.8; }
  .floor-ghost-tag { position: absolute; pointer-events: none; z-index: 61; font: 11px sans-serif; color: #fff; background: rgba(0,0,0,.7); padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
  #floorPanel textarea { width: 100%; height: 120px; background: #11111a; color: #9fe; border: 1px solid #334; font: 11px monospace; }
  .toolbar select, .toolbar button {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 4px 10px;
    font-family: inherit;
    font-size: 12px;
    border-radius: 3px;
    cursor: pointer;
  }
  .toolbar select:hover, .toolbar button:hover { border-color: var(--gold); }
  .toolbar button.primary { background: #2a2210; border-color: var(--gold); color: var(--gold); }
  .toolbar .spacer { flex: 1; }
  .toolbar .coords {
    color: var(--gold);
    font-size: 12px;
    min-width: 180px;
    text-align: right;
  }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Canvas area */
  .canvas-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 16px;
  }
  .viewport {
    position: relative;
    width: 960px;
    height: 540px;
    background: #111;
    border: 1px solid var(--border);
    cursor: crosshair;
    flex-shrink: 0;
    overflow: visible;
  }
  .viewport img.bg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    position: absolute;
    top: 0;
    left: 0;
  }

  /* Hotspot boxes */
  .hotspot {
    position: absolute;
    border: 2px solid var(--accent-obj);
    background: rgba(192, 160, 48, 0.12);
    cursor: move;
    z-index: 10;
  }
  .hotspot.nav { border-color: var(--accent-nav); background: rgba(68, 136, 204, 0.12); }
  .hotspot.has-sprite { border-color: var(--accent-sprite); background: rgba(204, 136, 255, 0.08); }
  .hotspot.selected { border-width: 3px; z-index: 20; }
  .hotspot.new-box { border-color: var(--accent-new); background: rgba(204, 68, 68, 0.15); border-style: dashed; }
  .hotspot .label {
    position: absolute;
    top: -18px;
    left: 0;
    font-size: 10px;
    color: var(--accent-obj);
    white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 0 3px #000, 0 0 6px #000;
  }
  .hotspot.nav .label { color: var(--accent-nav); }
  .hotspot.has-sprite .label { color: var(--accent-sprite); }
  .hotspot .handle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: var(--gold);
    border: 1px solid #000;
    z-index: 30;
  }
  .hotspot .handle.tl { top: -4px; left: -4px; cursor: nw-resize; }
  .hotspot .handle.tr { top: -4px; right: -4px; cursor: ne-resize; }
  .hotspot .handle.bl { bottom: -4px; left: -4px; cursor: sw-resize; }
  .hotspot .handle.br { bottom: -4px; right: -4px; cursor: se-resize; }

  /* Object sprite overlay */
  .obj-sprite {
    position: absolute;
    cursor: move;
    z-index: 11;
    image-rendering: auto;
    background-repeat: no-repeat;
  }
  .obj-sprite.selected {
    outline: 2px solid var(--accent-sprite);
    outline-offset: 2px;
  }
  .obj-sprite .handle {
    position: absolute; width: 14px; height: 14px;
    background: #ff0; border: 2px solid #000;
    z-index: 30; border-radius: 2px;
  }
  .obj-sprite .handle.tl { top: -7px; left: -7px; cursor: nw-resize; }
  .obj-sprite .handle.tr { top: -7px; right: -7px; cursor: ne-resize; }
  .obj-sprite .handle.bl { bottom: -7px; left: -7px; cursor: sw-resize; }
  .obj-sprite .handle.br { bottom: -7px; right: -7px; cursor: se-resize; }
  .obj-sprite .label {
    position: absolute; bottom: -16px; left: 50%;
    transform: translateX(-50%); font-size: 9px;
    color: var(--accent-sprite); white-space: nowrap;
    pointer-events: none; text-shadow: 0 1px 2px #000;
  }

  /* Character sprite */
  .char-sprite {
    position: absolute;
    cursor: move;
    z-index: 15;
    image-rendering: pixelated;
    background-repeat: no-repeat;
  }
  .char-shadow {
    position: absolute;
    pointer-events: none;
    z-index: 14;
    border-radius: 50%;
  }

  /* Draw preview */
  .draw-preview {
    position: absolute;
    border: 2px dashed var(--accent-new);
    background: rgba(204, 68, 68, 0.1);
    pointer-events: none;
    z-index: 25;
    display: none;
  }

  /* Side panel */
  .panel {
    width: 360px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* Panel tabs */
  .panel-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .panel-tab {
    flex: 1;
    padding: 8px 12px;
    text-align: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .panel-tab:hover { color: var(--text); }
  .panel-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  .panel-content {
    flex: 1;
    overflow-y: auto;
    display: none;
  }
  .panel-content.active { display: flex; flex-direction: column; }

  .panel-section {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .panel-section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gold-dim);
    margin-bottom: 8px;
  }

  /* Object list */
  .obj-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
  }
  .obj-row:hover { background: rgba(192, 160, 48, 0.08); }
  .obj-row.selected { background: rgba(192, 160, 48, 0.15); border: 1px solid var(--border); }
  .obj-row .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .obj-row .dot.obj { background: var(--accent-obj); }
  .obj-row .dot.nav { background: var(--accent-nav); }
  .obj-row .dot.char { background: var(--accent-char); }
  .obj-row .dot.sprite { background: var(--accent-sprite); }
  .obj-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .obj-row .pos { color: var(--text-dim); font-size: 10px; white-space: nowrap; }
  .obj-row .changed { color: var(--accent-new); font-weight: bold; font-size: 10px; }

  /* Character controls */
  .char-controls { display: flex; flex-direction: column; gap: 10px; }
  .char-controls .row { display: flex; align-items: center; gap: 8px; }
  .char-controls label { color: var(--text-dim); font-size: 11px; min-width: 70px; }
  .char-controls select, .char-controls input {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 3px 8px;
    font-family: inherit;
    font-size: 12px;
    border-radius: 3px;
  }
  .char-controls select:hover, .char-controls input:hover { border-color: var(--gold); }

  .facing-btns { display: flex; gap: 4px; }
  .facing-btn {
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 3px 10px;
    font-family: inherit;
    font-size: 11px;
    border-radius: 3px;
    cursor: pointer;
  }
  .facing-btn:hover { border-color: var(--gold); color: var(--text); }
  .facing-btn.active { background: #2a2210; border-color: var(--gold); color: var(--gold); }

  .anim-toggle {
    background: var(--bg);
    color: var(--accent-char);
    border: 1px solid var(--accent-char);
    padding: 4px 14px;
    font-family: inherit;
    font-size: 11px;
    border-radius: 3px;
    cursor: pointer;
  }
  .anim-toggle:hover { background: rgba(68, 204, 102, 0.1); }
  .anim-toggle.paused { color: var(--accent-new); border-color: var(--accent-new); }

  .char-pos-display {
    color: var(--gold);
    font-size: 13px;
    font-weight: bold;
  }

  .sprite-preview-box {
    margin-top: 8px;
    padding: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 120px;
    position: relative;
    overflow: hidden;
  }
  .sprite-preview-box .sprite-el {
    image-rendering: pixelated;
    background-repeat: no-repeat;
  }
  .no-char-msg {
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    padding: 20px;
  }

  /* Export modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--gold);
    border-radius: 6px;
    width: 750px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header h3 { color: var(--gold); font-size: 14px; }
  .modal-body { padding: 16px; flex: 1; overflow-y: auto; }
  .modal textarea {
    width: 100%;
    min-height: 300px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 12px;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    resize: vertical;
    border-radius: 3px;
  }
  .modal-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 12px;
  }
  .modal-tab {
    padding: 6px 16px;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    border: 1px solid var(--border);
    border-bottom: none;
    background: var(--bg);
    margin-right: -1px;
  }
  .modal-tab:first-child { border-radius: 4px 0 0 0; }
  .modal-tab:last-child { border-radius: 0 4px 0 0; }
  .modal-tab.active { color: var(--gold); background: var(--panel); border-bottom: 1px solid var(--panel); }
  .modal-footer {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }

  /* Status bar */
  /* Narration tab */
  .narr-config {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .narr-config label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--gold-dim); }
  .narr-config input, .narr-config select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 4px 8px;
    font-family: inherit;
    font-size: 12px;
    border-radius: 3px;
    width: 100%;
  }
  .narr-config input:focus, .narr-config select:focus { border-color: var(--gold); outline: none; }
  .narr-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
  }
  .narr-row:hover { background: rgba(192, 160, 48, 0.04); }
  .narr-row .narr-id { color: var(--text-dim); font-size: 10px; }
  .narr-row .narr-text { color: var(--text); line-height: 1.4; }
  .narr-row .narr-btns {
    display: flex;
    gap: 4px;
    margin-top: 4px;
    align-items: center;
  }
  .narr-row .narr-btns button {
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 2px 8px;
    font-family: inherit;
    font-size: 10px;
    border-radius: 2px;
    cursor: pointer;
  }
  .narr-row .narr-btns button:hover { color: var(--gold); border-color: var(--gold); }
  .narr-row .narr-btns button.has-audio { color: #44cc66; border-color: #44cc66; }
  .narr-row .narr-btns button.generating { color: var(--accent-new); border-color: var(--accent-new); cursor: wait; }
  .narr-row .narr-btns .narr-status { font-size: 10px; color: var(--text-dim); margin-left: 4px; }
  .narr-filter-bar {
    display: flex;
    gap: 4px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    align-items: center;
  }
  .narr-filter-bar button {
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 2px 8px;
    font-size: 10px;
    font-family: inherit;
    border-radius: 2px;
    cursor: pointer;
  }
  .narr-filter-bar button:hover { color: var(--text); }
  .narr-filter-bar button.active { color: var(--gold); border-color: var(--gold); }
  .narr-batch-bar {
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .narr-batch-bar button {
    background: #2a2210;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 4px 12px;
    font-family: inherit;
    font-size: 11px;
    border-radius: 3px;
    cursor: pointer;
  }
  .narr-batch-bar button:hover { background: #3a3218; }
  .narr-batch-bar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .narr-batch-bar .narr-progress { font-size: 10px; color: var(--text-dim); }
  .narr-summary {
    padding: 6px 12px;
    font-size: 10px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }

  .statusbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 4px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .statusbar .hint { flex: 1; }
  .statusbar .change-count { color: var(--accent-new); }

  /* Sprite detail panel */
  .sprite-detail { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .sprite-detail-header {
    display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
    font-size: 12px; color: var(--accent-sprite); font-weight: bold;
  }
  .sprite-detail-grid {
    display: grid; grid-template-columns: 80px 1fr; gap: 4px 8px;
    font-size: 11px;
  }
  .sprite-detail-grid .lbl { color: var(--text-dim); }
  .sprite-detail-grid .val { color: var(--text); }
  .sprite-detail-preview {
    margin-top: 8px; padding: 10px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    min-height: 100px; position: relative; overflow: hidden;
  }
  .sprite-detail-preview .sprite-el {
    image-rendering: pixelated; background-repeat: no-repeat;
  }
  .sprite-list-item {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; cursor: pointer; border-radius: 3px; font-size: 11px;
  }
  .sprite-list-item:hover { background: rgba(204, 136, 255, 0.08); }
  .sprite-list-item.active { background: rgba(204, 136, 255, 0.15); border: 1px solid var(--border); }
  .sprite-list-item .sprite-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-sprite); flex-shrink: 0; }
  .sprite-list-item .sprite-dot.char { background: var(--accent-char); }
  .sprite-list-item .sprite-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sprite-list-item .sprite-info { color: var(--text-dim); font-size: 10px; white-space: nowrap; }
  .shadow-row { display: flex; align-items: center; gap: 4px; }
  .shadow-range { width: 140px; vertical-align: middle; accent-color: var(--gold); cursor: pointer; }
  .nudge { width: 20px; height: 20px; padding: 0; line-height: 18px; font-size: 13px; background: transparent;
           color: var(--gold); border: 1px solid var(--border); border-radius: 3px; cursor: pointer; }
  .nudge:hover { background: rgba(192,160,48,0.12); }
  .sv { min-width: 34px; display: inline-block; color: var(--text); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="toolbar">
  <label>Scenario</label>
  <select id="scenarioSelect"><option value="">Loading...</option></select>
  <label>View</label>
  <select id="viewSelect"><option value="">Pick scenario first</option></select>
  <label style="margin-left:8px">
    <input type="checkbox" id="showHotspots" checked style="margin-right:4px;vertical-align:middle;">
    Hotspots
  </label>
  <label>
    <input type="checkbox" id="showSprites" checked style="margin-right:4px;vertical-align:middle;">
    Sprites
  </label>
  <div class="spacer"></div>
  <div class="coords" id="coordsDisplay">Move mouse over viewport</div>
  <button onclick="resetView()">Reset View</button>
  <button class="primary" onclick="showExport()">Export Changes</button>
</div>

<div class="main">
  <div class="canvas-wrap">
    <div class="viewport" id="viewport">
      <img class="bg" id="bgImage" src="" alt="background" />
      <div class="draw-preview" id="drawPreview"></div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-tabs">
      <div class="panel-tab active" data-tab="objects" onclick="switchTab('objects')">Objects</div>
      <div class="panel-tab" data-tab="character" onclick="switchTab('character')">Character</div>
      <div class="panel-tab" data-tab="floor" onclick="switchTab('floor')">Floor</div>
      <div class="panel-tab" data-tab="sprites" onclick="switchTab('sprites')">Sprites</div>
      <div class="panel-tab" data-tab="narration" onclick="switchTab('narration')">Narration</div>
    </div>
    <div class="panel-content active" id="tab-objects">
      <div id="objectList" style="padding:8px;"></div>
    </div>
    <div class="panel-content" id="tab-floor">
      <div id="floorPanel" style="padding:10px;"></div>
    </div>
    <div class="panel-content" id="tab-character">
      <div id="charPanel"></div>
    </div>
    <div class="panel-content" id="tab-sprites">
      <div id="spriteList" style="padding:8px;"></div>
      <div id="spriteDetail"></div>
    </div>
    <div class="panel-content" id="tab-narration">
      <div class="narr-config">
        <label>ElevenLabs API Key</label>
        <input type="password" id="narrApiKey" placeholder="sk_..." />
        <div style="display:flex;gap:6px;">
          <div style="flex:1;">
            <label>Voice</label>
            <select id="narrVoiceSelect"><option value="">-- Load voices --</option></select>
          </div>
          <div style="flex-shrink:0;align-self:flex-end;">
            <button onclick="narrLoadVoices()" style="background:var(--bg);color:var(--text-dim);border:1px solid var(--border);padding:4px 8px;font-size:10px;font-family:inherit;border-radius:2px;cursor:pointer;">Fetch</button>
          </div>
        </div>
      </div>
      <div class="narr-filter-bar" id="narrFilterBar"></div>
      <div class="narr-batch-bar" id="narrBatchBar">
        <button onclick="narrBatchGenerate()" id="narrBatchBtn" disabled>Generate Filtered</button>
        <button onclick="narrStop()" id="narrStopBtn" style="display:none;background:var(--bg);color:var(--accent-new);border:1px solid var(--accent-new);padding:4px 12px;font-family:inherit;font-size:11px;border-radius:3px;cursor:pointer;">Stop</button>
        <button onclick="narrDownloadZip()" style="background:var(--bg);color:var(--text-dim);border:1px solid var(--border);padding:4px 12px;font-family:inherit;font-size:11px;border-radius:3px;cursor:pointer;">Download ZIP</button>
        <span class="narr-progress" id="narrProgress"></span>
      </div>
      <div class="narr-summary" id="narrSummary"></div>
      <div id="narrList" style="overflow-y:auto;flex:1;"></div>
    </div>
  </div>
</div>

<div class="statusbar">
  <div class="hint" id="statusHint">Load a scenario to begin. Click + drag on empty space to draw a new hotspot box.</div>
  <div class="change-count" id="changeCount"></div>
  <div>960x720 coord space | viewport 960x540 | SCALE_Y=0.75</div>
</div>

<!-- Export modal -->
<div class="modal-overlay" id="exportModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Export Changes</h3>
      <button onclick="closeExport()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-tabs">
        <div class="modal-tab active" onclick="switchExportTab(0)">Changes</div>
        <div class="modal-tab" onclick="switchExportTab(1)">JSON Patch</div>
        <div class="modal-tab" onclick="switchExportTab(2)">Full View JSON</div>
      </div>
      <textarea id="exportText" readonly></textarea>
    </div>
    <div class="modal-footer">
      <button onclick="copyExport()">Copy to Clipboard</button>
      <button onclick="closeExport()">Close</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// State
// ============================================================
let scenario = null;
let scenarioId = '';
let currentViewId = '';
let objects = [];       // { id, name, x, y, w, h, isNav, hasSprite, sprite, origX, origY, origW, origH }
let character = null;   // { x, y, origX, origY, facing, sprite_set }
let charConfig = null;  // scenario.character config
let newBoxes = [];      // { id, x, y, w, h } — user-drawn boxes
let selectedId = null;
let selectedSpriteId = null; // for Sprites tab: '__character__' or object ID
let dragState = null;
let drawState = null;

// Animation state
let animPaused = false;
let charAnimFrame = 0;
let charAnimId = 0;
let objAnimFrames = {};  // { objectId: frame }
let objAnimIds = {};     // { objectId: rafId }

// Editor overrides (not from JSON)
let charFacingOverride = null;
let charSpriteSetOverride = null;

const SCALE_X = 1.0;
const SCALE_Y = 0.75;
const VP_W = 960;
const VP_H = 540;
const COORD_W = 960;
const COORD_H = 720;

function syncSpriteHitbox(obj) {
  if (!obj.sprite) return;
  const s = obj.sprite.scale || 1;
  obj.w = Math.round(obj.sprite.frame_width * s);
  obj.h = Math.round(obj.sprite.frame_height * s / SCALE_Y);
}

// ============================================================
// Init
// ============================================================
async function init() {
  try {
    const r = await fetch('/scenarios/manifest.json');
    const ids = await r.json();
    const sel = document.getElementById('scenarioSelect');
    sel.innerHTML = '<option value="">-- Select --</option>' +
      ids.map(id => `<option value="${id}">${id}</option>`).join('');
    sel.onchange = () => loadScenario(sel.value);
  } catch {
    document.getElementById('scenarioSelect').innerHTML =
      '<option value="">Failed to load manifest</option>';
  }

  const vp = document.getElementById('viewport');
  vp.addEventListener('mousedown', onMouseDown);
  vp.addEventListener('mousemove', onMouseMove);
  vp.addEventListener('mouseup', onMouseUp);
  vp.addEventListener('mouseleave', onMouseUp);
  vp.addEventListener('wheel', onWheel, { passive: false });
  document.addEventListener('keydown', onKeyDown);
  document.getElementById('showHotspots').addEventListener('change', render);
  document.getElementById('showSprites').addEventListener('change', render);
}

// ============================================================
// Scenario / View loading
// ============================================================
async function loadScenario(id) {
  if (!id) return;
  scenarioId = id;
  try {
    const r = await fetch(`/scenarios/${id}/scenario.json`);
    scenario = await r.json();
    charConfig = scenario.character || null;

    const sel = document.getElementById('viewSelect');
    sel.innerHTML = scenario.views.map(v =>
      `<option value="${v.id}">${v.name || v.id}</option>`
    ).join('');
    sel.onchange = () => loadView(sel.value);
    loadView(scenario.views[0].id);
  } catch (e) {
    alert('Failed to load scenario: ' + e.message);
  }
}

function loadView(viewId) {
  cancelAllAnimations();
  currentViewId = viewId;
  const view = scenario.views.find(v => v.id === viewId);
  if (!view) return;

  // Background — respect background_fit from the view JSON (default: cover)
  const bgFile = view.background_file || `backgrounds/${view.background_key}.webp`;
  const bgImg = document.getElementById('bgImage');
  bgImg.src = `/scenarios/${scenarioId}/${bgFile}`;
  bgImg.style.objectFit = view.background_fit || 'cover';

  // Objects
  objects = [];
  for (const objId of view.objects) {
    const obj = scenario.objects.find(o => o.id === objId);
    if (!obj) continue;
    const isNav = objId.startsWith('nav_');
    const entry = {
      id: obj.id,
      name: obj.name,
      x: obj.position.x,
      y: obj.position.y,
      w: obj.size.width,
      h: obj.size.height,
      isNav,
      hasSprite: !!obj.sprite,
      sprite: obj.sprite ? { ...obj.sprite } : null,
      origX: obj.position.x,
      origY: obj.position.y,
      origW: obj.size.width,
      origH: obj.size.height,
      origScale: obj.sprite ? (obj.sprite.scale || 1) : undefined,
      shadow: obj.shadow ? { ...obj.shadow } : null,
      origShadow: JSON.stringify(obj.shadow || null),
    };
    if (entry.hasSprite) {
      syncSpriteHitbox(entry);
      // The box derived from the sprite (rounded) is the starting point, not an edit.
      entry.origX = entry.x; entry.origY = entry.y; entry.origW = entry.w; entry.origH = entry.h;
    }
    objects.push(entry);
  }

  // Character
  charFacingOverride = null;
  charSpriteSetOverride = null;
  if (view.character) {
    character = {
      x: view.character.x,
      y: view.character.y,
      facing: view.character.facing || 'down',
      sprite_set: view.character.sprite_set || 'idle',
      frame: view.character.frame,
      origX: view.character.x,
      origY: view.character.y,
      shadow: view.character.shadow ? { ...view.character.shadow } : (charConfig && charConfig.shadow ? { ...charConfig.shadow } : null),
    };
    // Unchanged unless edited here (the global shadow is shown when the view has none of its own).
    character.origShadow = JSON.stringify(character.shadow || null);
  } else {
    character = null;
  }

  newBoxes = [];
  selectedId = null;
  selectedSpriteId = null;
  animPaused = false;
  charAnimFrame = 0;
  objAnimFrames = {};

  render();
  renderCharPanel();
  startAnimations();
  updateStatus();
}

// ============================================================
// Animation management
// ============================================================
function cancelAllAnimations() {
  if (charAnimId) { cancelAnimationFrame(charAnimId); charAnimId = 0; }
  for (const id of Object.values(objAnimIds)) { cancelAnimationFrame(id); }
  objAnimIds = {};
  objAnimFrames = {};
}

function startAnimations() {
  if (animPaused) return;
  startCharAnimation();
  for (const obj of objects) {
    if (obj.hasSprite && obj.sprite.frame_rate > 0) {
      startObjAnimation(obj.id, obj.sprite);
    }
  }
}

function startCharAnimation() {
  if (!character || !charConfig) return;
  const ss = charConfig.sprite_sets[getCharSpriteSet()];
  if (!ss || ss.frame_rate <= 0) return;
  if (character.frame !== undefined) return; // static placement

  let last = 0;
  const interval = 1000 / ss.frame_rate;
  const shouldLoop = ss.loop !== false;

  function tick(time) {
    if (time - last >= interval) {
      last = time;
      charAnimFrame++;
      if (charAnimFrame >= ss.columns) {
        charAnimFrame = shouldLoop ? 0 : ss.columns - 1;
      }
      updateCharSprite();
    }
    charAnimId = requestAnimationFrame(tick);
  }
  charAnimFrame = 0;
  charAnimId = requestAnimationFrame(tick);
}

function startObjAnimation(objId, sprite) {
  let last = 0;
  const interval = 1000 / sprite.frame_rate;
  objAnimFrames[objId] = 0;

  function tick(time) {
    if (time - last >= interval) {
      last = time;
      objAnimFrames[objId] = (objAnimFrames[objId] + 1) % sprite.columns;
      updateObjSprite(objId);
    }
    objAnimIds[objId] = requestAnimationFrame(tick);
  }
  objAnimIds[objId] = requestAnimationFrame(tick);
}

function togglePause() {
  animPaused = !animPaused;
  if (animPaused) {
    cancelAllAnimations();
  } else {
    startAnimations();
  }
  renderCharPanel();
}

function getCharFacing() {
  return charFacingOverride || (character ? character.facing : 'down');
}

function getCharSpriteSet() {
  return charSpriteSetOverride || (character ? character.sprite_set : 'idle');
}

// ============================================================
// Rendering
// ============================================================
// Set while a shadow slider is being dragged so render() redraws the viewport but leaves the
// panel (and the slider under the cursor) alone.
let keepPanel = false;

function render() {
  const vp = document.getElementById('viewport');
  const showHotspots = document.getElementById('showHotspots').checked;
  const showSprites = document.getElementById('showSprites').checked;

  // Remove old dynamic elements
  vp.querySelectorAll('.hotspot, .char-sprite, .char-shadow, .obj-sprite').forEach(el => el.remove());

  // Render object sprites (behind hotspots)
  if (showSprites) {
    for (const obj of objects) {
      if (!obj.hasSprite) continue;
      renderObjSprite(vp, obj);
    }
  }

  // Render hotspot boxes
  if (showHotspots) {
    for (const obj of [...objects, ...newBoxes]) {
      renderHotspotBox(vp, obj);
    }
  }

  // Render character sprite
  if (showSprites && character && charConfig) {
    renderCharacter(vp);
  }

  renderObjectList();
  if (!keepPanel) renderSpritePanel();
}

function renderHotspotBox(vp, obj) {
  if (obj.hasSprite) return;
  const el = document.createElement('div');
  el.className = 'hotspot' +
    (obj.isNav ? ' nav' : '') +
    (obj.hasSprite ? ' has-sprite' : '') +
    (obj.id === selectedId ? ' selected' : '') +
    (obj.isNew ? ' new-box' : '');
  el.dataset.id = obj.id;

  const sx = obj.x * SCALE_X;
  const sy = obj.y * SCALE_Y;
  const sw = obj.w * SCALE_X;
  const sh = obj.h * SCALE_Y;

  el.style.left = sx + 'px';
  el.style.top = sy + 'px';
  el.style.width = sw + 'px';
  el.style.height = sh + 'px';

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = obj.name || obj.id;
  el.appendChild(label);

  if (obj.id === selectedId) {
    for (const corner of ['tl', 'tr', 'bl', 'br']) {
      const h = document.createElement('div');
      h.className = 'handle ' + corner;
      h.dataset.corner = corner;
      el.appendChild(h);
    }
  }

  vp.appendChild(el);
}

function renderObjSprite(vp, obj) {
  const sp = obj.sprite;
  const fw = sp.frame_width;
  const fh = sp.frame_height;
  const scale = sp.scale || 1;
  const renderW = fw * scale;
  const renderH = fh * scale;
  const screenX = obj.x * SCALE_X; // matches game: position.x is bottom-center anchor
  const screenY = obj.y * SCALE_Y; // matches game: position.y is bottom anchor
  const sheetW = sp.columns * fw * scale;
  const sheetH = (sp.rows || 1) * fh * scale;
  const frame = objAnimFrames[obj.id] || 0;
  const bgX = -(frame * fw) * scale;

  // Render shadow if configured
  if (obj.shadow) {
    const sh = obj.shadow;
    const shadowEl = document.createElement('div');
    shadowEl.className = 'obj-sprite';
    shadowEl.style.position = 'absolute';
    const sw = sh.width ?? 60;
    const sheight = sh.height ?? 10;
    shadowEl.style.left = (screenX + (sh.offset_x ?? 0) - sw / 2) + 'px';
    shadowEl.style.top = (screenY + (sh.offset_y ?? 0) - sheight / 2) + 'px';
    shadowEl.style.width = sw + 'px';
    shadowEl.style.height = sheight + 'px';
    shadowEl.style.borderRadius = '50%';
    shadowEl.style.background = `radial-gradient(ellipse, ${sh.color ?? 'rgba(0,0,0,0.5)'} 0%, ${sh.color ?? 'rgba(0,0,0,0.5)'} 40%, transparent 100%)`;
    shadowEl.style.opacity = sh.opacity ?? 0.6;
    if (sh.skew_x) shadowEl.style.transform = `skewX(${sh.skew_x}deg)`;
    shadowEl.style.pointerEvents = 'none';
    shadowEl.style.zIndex = '10';
    shadowEl.style.cursor = 'default';
    vp.appendChild(shadowEl);
  }

  const el = document.createElement('div');
  el.className = 'obj-sprite' + (selectedSpriteId === obj.id ? ' selected' : '');
  el.dataset.spriteFor = obj.id;
  el.style.left = (screenX - renderW / 2) + 'px';
  el.style.top = (screenY - renderH) + 'px';
  el.style.width = renderW + 'px';
  el.style.height = renderH + 'px';
  el.style.backgroundImage = `url(/scenarios/${scenarioId}/${sp.file})`;
  el.style.backgroundPosition = `${bgX}px 0px`;
  el.style.backgroundSize = `${sheetW}px ${sheetH}px`;

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = obj.name || obj.id;
  el.appendChild(label);

  if (selectedSpriteId === obj.id) {
    for (const corner of ['tl', 'tr', 'bl', 'br']) {
      const h = document.createElement('div');
      h.className = 'handle ' + corner;
      h.dataset.corner = corner;
      el.appendChild(h);
    }
  }

  vp.appendChild(el);
}

function updateObjSprite(objId) {
  const el = document.querySelector(`.obj-sprite[data-sprite-for="${objId}"]`);
  if (!el) return;
  const obj = objects.find(o => o.id === objId);
  if (!obj || !obj.sprite) return;
  const sp = obj.sprite;
  const scale = sp.scale || 1;
  const frame = objAnimFrames[objId] || 0;
  const bgX = -(frame * sp.frame_width) * scale;
  el.style.backgroundPosition = `${bgX}px 0px`;

  if (selectedSpriteId === objId) renderSpriteDetailPreview(objId);
}

function renderCharacter(vp) {
  const ss = charConfig.sprite_sets[getCharSpriteSet()];
  if (!ss) return;

  const fw = charConfig.frame_width;
  const fh = charConfig.frame_height;
  const scale = charConfig.scale || 1;
  const renderW = fw * scale;
  const renderH = fh * scale;
  const screenX = character.x * SCALE_X;
  const screenY = character.y * SCALE_Y;
  const sheetW = ss.columns * fw * scale;
  const sheetH = ss.rows * fh * scale;

  const directions = ss.directions || ['down', 'left', 'right', 'up'];
  const facing = getCharFacing();
  const mirrorFacing = facing === 'left' && !directions.includes('left');
  const effectiveFacing = mirrorFacing ? 'right' : facing;
  const row = Math.max(0, directions.indexOf(effectiveFacing));

  const frame = (character.frame !== undefined) ? character.frame : charAnimFrame;
  const bgX = -(frame * fw) * scale;
  const bgY = -(row * fh) * scale;

  // Shadow — per-view override takes precedence
  const shadow = character.shadow || charConfig.shadow;
  if (shadow) {
    const se = document.createElement('div');
    se.className = 'char-shadow';
    const sw = shadow.width || renderW * 0.6;
    const sh = shadow.height || 6;
    se.style.left = (screenX + (shadow.offset_x || 0) - sw / 2) + 'px';
    se.style.top = (screenY + (shadow.offset_y || 0) - sh / 2) + 'px';
    se.style.width = sw + 'px';
    se.style.height = sh + 'px';
    se.style.background = `radial-gradient(ellipse, ${shadow.color || 'rgba(0,0,0,0.5)'} 0%, ${shadow.color || 'rgba(0,0,0,0.5)'} 40%, transparent 100%)`;
    se.style.opacity = shadow.opacity || 0.6;
    if (shadow.skew_x) se.style.transform = `skewX(${shadow.skew_x}deg)`;
    vp.appendChild(se);
  }

  // Sprite
  const el = document.createElement('div');
  el.className = 'char-sprite';
  el.dataset.id = '__character__';
  el.style.left = (screenX - renderW / 2) + 'px';
  el.style.top = (screenY - renderH) + 'px';
  el.style.width = renderW + 'px';
  el.style.height = renderH + 'px';
  el.style.backgroundImage = `url(/scenarios/${scenarioId}/${ss.file})`;
  el.style.backgroundPosition = `${bgX}px ${bgY}px`;
  el.style.backgroundSize = `${sheetW}px ${sheetH}px`;
  if (mirrorFacing) {
    el.style.transform = 'scaleX(-1)';
  }

  vp.appendChild(el);
}

function updateCharSprite() {
  const el = document.querySelector('.char-sprite');
  if (!el || !charConfig || !character) return;
  const ss = charConfig.sprite_sets[getCharSpriteSet()];
  if (!ss) return;

  const fw = charConfig.frame_width;
  const fh = charConfig.frame_height;
  const scale = charConfig.scale || 1;

  const directions = ss.directions || ['down', 'left', 'right', 'up'];
  const facing = getCharFacing();
  const mirrorFacing = facing === 'left' && !directions.includes('left');
  const effectiveFacing = mirrorFacing ? 'right' : facing;
  const row = Math.max(0, directions.indexOf(effectiveFacing));

  const frame = charAnimFrame;
  const bgX = -(frame * fw) * scale;
  const bgY = -(row * fh) * scale;

  el.style.backgroundPosition = `${bgX}px ${bgY}px`;
  el.style.transform = mirrorFacing ? 'scaleX(-1)' : '';

  if (selectedSpriteId === '__character__') renderSpriteDetailPreview('__character__');
}

function renderObjectList() {
  const listEl = document.getElementById('objectList');
  let html = '';

  // Character
  if (character) {
    const changed = character.x !== character.origX || character.y !== character.origY;
    html += `<div class="obj-row${selectedId === '__character__' ? ' selected' : ''}"
                  onclick="selectObject('__character__')">
      <div class="dot char"></div>
      <div class="name">Character</div>
      <div class="pos">(${character.x}, ${character.y})</div>
      ${changed ? '<div class="changed">*</div>' : ''}
    </div>`;
  }

  // Objects
  for (const obj of objects) {
    const changed = obj.x !== obj.origX || obj.y !== obj.origY ||
                    obj.w !== obj.origW || obj.h !== obj.origH;
    const dotClass = obj.hasSprite ? 'sprite' : (obj.isNav ? 'nav' : 'obj');
    html += `<div class="obj-row${selectedId === obj.id ? ' selected' : ''}"
                  onclick="selectObject('${obj.id}')">
      <div class="dot ${dotClass}"></div>
      <div class="name" title="${obj.id}">${obj.name || obj.id}</div>
      <div class="pos">(${obj.x},${obj.y}) ${obj.w}x${obj.h}</div>
      ${changed ? '<div class="changed">*</div>' : ''}
    </div>`;
  }

  // New boxes
  for (const box of newBoxes) {
    html += `<div class="obj-row${selectedId === box.id ? ' selected' : ''}"
                  onclick="selectObject('${box.id}')" style="border-left: 2px solid var(--accent-new);">
      <div class="dot" style="background:var(--accent-new)"></div>
      <div class="name">${box.id}</div>
      <div class="pos">(${box.x},${box.y}) ${box.w}x${box.h}</div>
      <div class="changed">NEW</div>
    </div>`;
  }

  listEl.innerHTML = html;
}

// ============================================================
// Character panel
// ============================================================
function renderCharPanel() {
  const panel = document.getElementById('charPanel');

  if (!character || !charConfig) {
    panel.innerHTML = '<div class="no-char-msg">No character placement in this view.</div>';
    return;
  }

  const spriteSets = Object.keys(charConfig.sprite_sets);
  const currentSS = getCharSpriteSet();
  const ss = charConfig.sprite_sets[currentSS];
  const dirs = ss ? (ss.directions || ['down', 'left', 'right', 'up']) : [];
  const allDirs = [...new Set([...dirs, ...(dirs.includes('left') ? [] : dirs.includes('right') ? ['left'] : [])])];
  if (!allDirs.includes('left') && dirs.includes('right')) allDirs.push('left');
  const currentFacing = getCharFacing();

  let html = '';

  // Position
  html += `<div class="panel-section">
    <div class="panel-section-title">Position (960x720)</div>
    <div class="char-controls">
      <div class="row">
        <label>X, Y:</label>
        <span class="char-pos-display">${character.x}, ${character.y}</span>
      </div>
      ${(character.x !== character.origX || character.y !== character.origY)
        ? `<div style="font-size:10px;color:var(--accent-new);margin-top:2px;">was (${character.origX}, ${character.origY})</div>`
        : ''}
    </div>
  </div>`;

  // Sprite Set
  html += `<div class="panel-section">
    <div class="panel-section-title">Sprite Set</div>
    <div class="char-controls">
      <div class="row">
        <select id="charSpriteSetSelect" onchange="onCharSpriteSetChange(this.value)">
          ${spriteSets.map(s => `<option value="${s}"${s === currentSS ? ' selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
      <div style="font-size:10px;color:var(--text-dim);margin-top:2px;">
        ${ss ? `${ss.columns} frames, ${ss.rows} row${ss.rows > 1 ? 's' : ''}, ${ss.frame_rate || 0}fps` : ''}
        ${ss && ss.loop === false ? ', no loop' : ''}
      </div>
    </div>
  </div>`;

  // Facing
  html += `<div class="panel-section">
    <div class="panel-section-title">Facing Direction</div>
    <div class="char-controls">
      <div class="facing-btns">
        ${allDirs.map(d => `<button class="facing-btn${d === currentFacing ? ' active' : ''}" onclick="onCharFacingChange('${d}')">${d}${!dirs.includes(d) ? ' (flip)' : ''}</button>`).join('')}
      </div>
    </div>
  </div>`;

  // Animation control
  html += `<div class="panel-section">
    <div class="panel-section-title">Animation</div>
    <div class="char-controls">
      <div class="row">
        <button class="anim-toggle${animPaused ? ' paused' : ''}" onclick="togglePause()">
          ${animPaused ? '▶ Play' : '⏸ Pause'}
        </button>
        <span style="font-size:11px;color:var(--text-dim);">Frame: ${charAnimFrame}</span>
      </div>
    </div>
  </div>`;

  // Sprite preview
  html += `<div class="panel-section">
    <div class="panel-section-title">Preview</div>
    <div class="sprite-preview-box" id="charPreviewBox"></div>
  </div>`;

  // Config info
  html += `<div class="panel-section">
    <div class="panel-section-title">Config</div>
    <div style="font-size:10px;color:var(--text-dim);line-height:1.6;">
      frame: ${charConfig.frame_width}x${charConfig.frame_height}<br>
      scale: ${charConfig.scale}<br>
      rendered: ${Math.round(charConfig.frame_width * charConfig.scale)}x${Math.round(charConfig.frame_height * charConfig.scale)}px
      ${charConfig.shadow ? `<br>shadow: ${charConfig.shadow.width}x${charConfig.shadow.height}` : ''}
    </div>
  </div>`;

  panel.innerHTML = html;

  // Render sprite preview in the box
  renderCharPreview();
}

function renderCharPreview() {
  const box = document.getElementById('charPreviewBox');
  if (!box || !charConfig || !character) return;
  box.innerHTML = '';

  const ss = charConfig.sprite_sets[getCharSpriteSet()];
  if (!ss) { box.innerHTML = '<span style="color:var(--text-dim);">No sprite set</span>'; return; }

  const fw = charConfig.frame_width;
  const fh = charConfig.frame_height;
  const previewScale = Math.min(1, 100 / fh); // fit ~100px tall
  const renderW = fw * previewScale;
  const renderH = fh * previewScale;
  const sheetW = ss.columns * fw * previewScale;
  const sheetH = ss.rows * fh * previewScale;

  const directions = ss.directions || ['down', 'left', 'right', 'up'];
  const facing = getCharFacing();
  const mirrorFacing = facing === 'left' && !directions.includes('left');
  const effectiveFacing = mirrorFacing ? 'right' : facing;
  const row = Math.max(0, directions.indexOf(effectiveFacing));
  const frame = charAnimFrame;
  const bgX = -(frame * fw) * previewScale;
  const bgY = -(row * fh) * previewScale;

  const el = document.createElement('div');
  el.className = 'sprite-el';
  el.style.width = renderW + 'px';
  el.style.height = renderH + 'px';
  el.style.backgroundImage = `url(/scenarios/${scenarioId}/${ss.file})`;
  el.style.backgroundPosition = `${bgX}px ${bgY}px`;
  el.style.backgroundSize = `${sheetW}px ${sheetH}px`;
  if (mirrorFacing) el.style.transform = 'scaleX(-1)';

  box.appendChild(el);
}

function onCharSpriteSetChange(val) {

function renderSpritePanel() {
  const listEl = document.getElementById('spriteList');

  // Build list of all sprites on this view
  let html = '<div class="panel-section"><div class="panel-section-title">Sprites on this View</div>';

  // Character sprite
  if (character && charConfig) {
    const ss = charConfig.sprite_sets[character.sprite_set || 'idle'];
    html += `<div class="sprite-list-item${selectedSpriteId === '__character__' ? ' active' : ''}"

      <div class="sprite-info">${charConfig.frame_width}x${charConfig.frame_height} s${charConfig.scale}</div>
    </div>`;
  }

  // Object sprites
  for (const obj of objects) {

    html += `<div class="sprite-list-item${selectedSpriteId === obj.id ? ' active' : ''}"

// ============================================================
// Floor editor (walk_area) — docs/WALKABLE_AREAS.md
// Click the picture to add points (near an edge inserts there), drag to move, right-click to delete.
// ============================================================
let floorData = null;     // { floor: [[x,y]], blocked: [[[x,y]]], depth_scale|null }
let floorActive = 'floor'; // 'floor' or the index of a blocked area
let floorDrag = null;

function floorLoad() {
  const view = scenario && scenario.views.find(v => v.id === currentViewId);
  const wa = view && view.walk_area;
  floorData = wa ? JSON.parse(JSON.stringify({ floor: wa.floor || [], blocked: wa.blocked || [], depth_scale: wa.depth_scale || null }))
                 : { floor: [], blocked: [], depth_scale: null };
  floorActive = 'floor'; floorSaveMsg = '';
  renderFloor();
}
function floorRing() { return floorActive === 'floor' ? floorData.floor : floorData.blocked[floorActive]; }
function floorEditing() { return document.querySelector('.panel-tab.active')?.dataset.tab === 'floor'; }

// --- geometry helpers (same rules as the engine: points on an outline count as inside) ---
function fpSegDist(p, a, b) { const dx = b[0]-a[0], dy = b[1]-a[1]; const L = dx*dx+dy*dy; let t = L ? ((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(p[0]-(a[0]+t*dx), p[1]-(a[1]+t*dy)); }
function fpInside(p, ring) {
  if (ring.length < 3) return false;
  for (let i = 0; i < ring.length; i++) if (fpSegDist(p, ring[i], ring[(i+1)%ring.length]) < 1e-6) return true;
  let c = false; for (let i = 0, j = ring.length-1; i < ring.length; j = i++) { const a = ring[i], b = ring[j]; if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < a[0] + (p[1]-a[1])*(b[0]-a[0])/(b[1]-a[1])) c = !c; }
  return c;
}
function fpCross(o, a, b) { return (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]); }
function fpSelfCrossing(ring) {
  const n = ring.length; if (n < 4) return false;
  for (let i = 0; i < n; i++) for (let j = i+1; j < n; j++) {
    if (j === i+1 || (i === 0 && j === n-1)) continue;
    const a = ring[i], b = ring[(i+1)%n], c = ring[j], d = ring[(j+1)%n];
    const d1 = fpCross(c,d,a), d2 = fpCross(c,d,b), d3 = fpCross(a,b,c), d4 = fpCross(a,b,d);
    if (((d1>0&&d2<0)||(d1<0&&d2>0)) && ((d3>0&&d4<0)||(d3<0&&d4>0))) return true;
  }
  return false;
}

function renderFloor() {
  const vp = document.getElementById('viewport');
  if (!vp || !floorData) return;
  let svg = vp.querySelector('.floor-svg');
  if (!svg) {
    svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'floor-svg'); svg.setAttribute('viewBox', '0 0 960 540');
    svg.addEventListener('mousedown', floorMouseDown);
    svg.addEventListener('contextmenu', floorContextMenu);
    vp.appendChild(svg);
    document.addEventListener('mousemove', floorMouseMove);
    document.addEventListener('mouseup', () => { if (floorDrag) { floorDrag = null; renderFloor(); } });
  }
  const editing = floorEditing();
  svg.classList.toggle('editing', editing);
  const showAlways = !!(scenario && scenario.views.find(v => v.id === currentViewId)?.walk_area);
  svg.style.display = (editing || showAlways) ? '' : 'none';
  const pts = r => r.map(([x, y]) => `${x},${y * SCALE_Y}`).join(' ');
  let html = '';
  const ringSvg = (ring, idx, fill, stroke) => {
    const active = floorActive === idx;
    if (ring.length >= 3) html += `<polygon points="${pts(ring)}" fill="${fill}" stroke="${stroke}" stroke-width="${active ? 2.5 : 1.5}"/>`;
    else if (ring.length === 2) html += `<polyline points="${pts(ring)}" fill="none" stroke="${stroke}" stroke-width="2"/>`;
    if (editing && active) ring.forEach(([x, y], i) => { html += `<circle cx="${x}" cy="${y * SCALE_Y}" r="6" fill="${stroke}" stroke="#000" stroke-width="1.5" data-ring="${idx}" data-idx="${i}"><title>${x}, ${y} — drag to move, right-click to delete</title></circle>`; });
  };
  ringSvg(floorData.floor, 'floor', editing ? 'rgba(34,211,238,0.18)' : 'rgba(34,211,238,0.10)', '#22d3ee');
  floorData.blocked.forEach((b, i) => ringSvg(b, i, 'rgba(248,113,113,0.25)', '#f87171'));
  // depth guides
  const ds = floorData.depth_scale;
  if (editing && ds) for (const [y, label] of [[ds.far_y, `far ×${ds.far}`], [ds.near_y, `near ×${ds.near}`]]) {
    html += `<line x1="0" x2="960" y1="${y * SCALE_Y}" y2="${y * SCALE_Y}" stroke="#facc15" stroke-dasharray="6 4"/><text x="8" y="${y * SCALE_Y - 4}" fill="#facc15" font-size="12">${label} (y ${y})</text>`;
  }
  svg.innerHTML = html;
  renderFloorGhosts();
  if (editing) renderFloorPanel();
}

function floorPointFromEvent(e) {
  const r = document.getElementById('viewport').getBoundingClientRect();
  return [Math.round(e.clientX - r.left), Math.round((e.clientY - r.top) / SCALE_Y)];
}
function floorMouseDown(e) {
  if (!floorEditing() || e.button !== 0) return;
  e.preventDefault(); e.stopPropagation();
  const t = e.target;
  if (t.tagName === 'circle') { floorDrag = { ring: t.dataset.ring === 'floor' ? 'floor' : +t.dataset.ring, idx: +t.dataset.idx }; return; }
  const p = floorPointFromEvent(e);
  const ring = floorRing(); if (!ring) return;
  // Clicking near an existing edge inserts the point into that edge; otherwise it is appended.
  let best = -1, bestD = 10;
  if (ring.length >= 2) for (let i = 0; i < ring.length; i++) {
    if (ring.length === 2 && i === 1) break;
    const a = ring[i], b = ring[(i+1) % ring.length];
    const d = fpSegDist([p[0], p[1]*SCALE_Y], [a[0], a[1]*SCALE_Y], [b[0], b[1]*SCALE_Y]);
    if (d < bestD) { bestD = d; best = i; }
  }
  if (best >= 0) ring.splice(best + 1, 0, p); else ring.push(p);
  renderFloor();
}
function floorMouseMove(e) {
  if (!floorDrag) { floorHover(e); return; }
  const ring = floorDrag.ring === 'floor' ? floorData.floor : floorData.blocked[floorDrag.ring];
  const [x, y] = floorPointFromEvent(e);
  ring[floorDrag.idx] = [Math.max(0, Math.min(960, x)), Math.max(0, Math.min(720, y))];
  renderFloor();
  if (floorGhostOpts.cursor && floorDrag.ring === 'floor') floorCursorGhost(ring[floorDrag.idx]);
}
function floorContextMenu(e) {
  if (!floorEditing()) return;
  e.preventDefault(); e.stopPropagation();
  const t = e.target; if (t.tagName !== 'circle') return;
  const ring = t.dataset.ring === 'floor' ? floorData.floor : floorData.blocked[+t.dataset.ring];
  ring.splice(+t.dataset.idx, 1); renderFloor();
}

function floorJson() {
  const wa = { floor: floorData.floor };
  const blocked = floorData.blocked.filter(b => b.length >= 3);
  if (blocked.length) wa.blocked = blocked;
  if (floorData.depth_scale) wa.depth_scale = floorData.depth_scale;
  const fmt = r => '[' + r.map(([x, y]) => `[${x}, ${y}]`).join(', ') + ']';
  let txt = `"walk_area": {\n  "floor": ${fmt(wa.floor)}`;
  if (wa.blocked) txt += `,\n  "blocked": [\n    ${wa.blocked.map(fmt).join(',\n    ')}\n  ]`;
  if (wa.depth_scale) txt += `,\n  "depth_scale": ${JSON.stringify(wa.depth_scale).replace(/:/g, ': ').replace(/,/g, ', ')}`;
  return txt + '\n}';
}
function floorProblems() {
  const out = [];
  const f = floorData.floor;
  if (f.length < 3) out.push('The floor needs at least 3 points.');
  else if (fpSelfCrossing(f)) out.push('The floor outline crosses itself.');
  floorData.blocked.forEach((b, i) => {
    if (b.length && b.length < 3) out.push(`Blocked area ${i+1} needs at least 3 points.`);

// --- Player preview: the character drawn where he would stand (docs: SCENARIO_SCHEMA → Walkable Areas) ---
// The player is always drawn over the painting, so the floor must be open floor: every figure has to look like
// it stands ON the floor, never on or behind furniture.
const floorGhostOpts = { cursor: true, samples: false };
let floorSaveMsg = '';
function floorWalkable(p) {
  if (!floorData || floorData.floor.length < 3 || !fpInside(p, floorData.floor)) return false;
  return !floorData.blocked.some(b => b.length >= 3 && fpInside(p, b) && !b.some((q, i) => fpSegDist(p, q, b[(i + 1) % b.length]) < 1e-6));
}
function floorGhostScale(y) {
  const ds = floorData && floorData.depth_scale;
  if (!ds) return 1;
  const t = Math.max(0, Math.min(1, (y - ds.far_y) / ((ds.near_y - ds.far_y) || 1)));
  return ds.far + (ds.near - ds.far) * t;
}
function floorGhostStyle(el, x, y) {
  const ss = charConfig && (charConfig.sprite_sets.idle || Object.values(charConfig.sprite_sets)[0]);
  if (!ss) return false;
  const sc = (charConfig.scale || 1) * floorGhostScale(y), fw = charConfig.frame_width, fh = charConfig.frame_height;
  const dirs = ss.directions || ['down']; const row = Math.max(0, dirs.indexOf('down'));
  const w = fw * sc, h = fh * sc;
  Object.assign(el.style, { left: `${x - w / 2}px`, top: `${y * SCALE_Y - h}px`, width: `${w}px`, height: `${h}px`,
    backgroundImage: `url(/scenarios/${scenarioId}/${ss.file})`, backgroundSize: `${(ss.columns || 1) * w}px ${(ss.rows || 1) * h}px`,
    backgroundPosition: `0px ${-row * h}px` });

}
function floorCursorGhost(p) {

  let g = vp.querySelector('.floor-ghost.cursor'), tag = vp.querySelector('.floor-ghost-tag');
  if (!p) { g?.remove(); tag?.remove(); return; }
  if (!g) { g = document.createElement('div'); g.className = 'floor-ghost cursor'; vp.appendChild(g); }
  if (!tag) { tag = document.createElement('div'); tag.className = 'floor-ghost-tag'; vp.appendChild(tag); }
  if (!floorGhostStyle(g, p[0], p[1])) return;
  const on = floorWalkable(p);
  g.classList.toggle('off', !on);
  tag.textContent = `${on ? '' : 'off the floor · '}${p[0]}, ${p[1]}`;
  Object.assign(tag.style, { left: `${p[0] + 8}px`, top: `${p[1] * SCALE_Y + 4}px` });
}
function floorHover(e) {
  if (!floorEditing() || !floorGhostOpts.cursor) { floorCursorGhost(null); return; }
  const r = document.getElementById('viewport').getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) { floorCursorGhost(null); return; }
  floorCursorGhost(floorPointFromEvent(e));
}
function renderFloorGhosts() {
  const vp = document.getElementById('viewport'); if (!vp) return;
  vp.querySelectorAll('.floor-ghost.sample').forEach(n => n.remove());
  if (!floorEditing()) floorCursorGhost(null);
  if (!floorEditing() || !floorGhostOpts.samples || !floorData || floorData.floor.length < 3) return;
  const f = floorData.floor, cx = f.reduce((a, p) => a + p[0], 0) / f.length, cy = f.reduce((a, p) => a + p[1], 0) / f.length;
  const pts = [];
  for (const [x, y] of f) for (const k of [0.06, 0.15, 0.3]) { const p = [x + (cx - x) * k, y + (cy - y) * k]; if (floorWalkable(p)) { pts.push(p); break; } }

// Hook into view loading and tab switching
const _floorOrigLoadView = loadView;

const _floorOrigSwitchTab = switchTab;
switchTab = function (tab) { _floorOrigSwitchTab(tab); renderFloor(); };

// ============================================================
// Mouse interactions
// ============================================================
function getCoords(e) {
  const vp = document.getElementById('viewport');
  const rect = vp.getBoundingClientRect();
  const px = Math.round(e.clientX - rect.left);
  const py = Math.round(e.clientY - rect.top);
  const jx = Math.round(px / SCALE_X);
  const jy = Math.round(py / SCALE_Y);
  return { px, py, jx, jy };
}

function onMouseDown(e) {
  const { px, py, jx, jy } = getCoords(e);
  const target = e.target;

  // Handle resize
  if (target.classList.contains('handle')) {
    e.preventDefault();
    const corner = target.dataset.corner;
    const obj = findObject(selectedId);
    if (obj) {
      dragState = {
        type: 'resize',
        corner,
        id: selectedId,
        startMX: px, startMY: py,
        startX: obj.x, startY: obj.y,
        startW: obj.w, startH: obj.h,
      };
    }
    return;
  }

  // Handle character sprite drag
  const charSprite = target.closest('.char-sprite');
  if (charSprite && character) {
    e.preventDefault();
    selectedId = '__character__';
    selectedSpriteId = '__character__';
    dragState = {
      type: 'move-char',
      id: '__character__',
      startMX: px, startMY: py,
      startX: character.x, startY: character.y,
    };
    render();
    renderSpritePanel();
    switchTab('sprites');
    return;
  }

  // Handle sprite resize via corner handles
  const spriteHandle = target.closest('.obj-sprite .handle');
  if (spriteHandle) {
    e.preventDefault();
    const spriteEl = spriteHandle.closest('.obj-sprite');
    const objId = spriteEl.dataset.spriteFor;
    selectedSpriteId = objId;
    selectedId = objId;
    const obj = objects.find(o => o.id === objId);
    if (obj && obj.sprite) {
      dragState = {
        type: 'resize-sprite',
        id: objId,
        corner: spriteHandle.dataset.corner,
        startMX: px, startMY: py,
        startX: obj.x, startY: obj.y,
        startScale: obj.sprite.scale || 1,
        startW: obj.w, startH: obj.h,
      };
    }
    render();
    renderSpritePanel();
    switchTab('sprites');
    return;
  }

  // Handle object sprite drag
  const objSprite = target.closest('.obj-sprite');
  if (objSprite) {
    e.preventDefault();
    const objId = objSprite.dataset.spriteFor;
    selectedId = objId;
    selectedSpriteId = objId;
    const obj = objects.find(o => o.id === objId);
    if (obj) {
      dragState = {
        type: 'move',
        id: objId,
        startMX: px, startMY: py,
        startX: obj.x, startY: obj.y,
      };
    }
    render();
    renderSpritePanel();
    switchTab('sprites');
    return;
  }

  // Handle hotspot drag
  const hotspot = target.closest('.hotspot');
  if (hotspot) {
    e.preventDefault();
    const id = hotspot.dataset.id;
    selectedId = id;
    const obj = findObject(id);
    if (obj) {
      dragState = {
        type: 'move',
        id,
        startMX: px, startMY: py,
        startX: obj.x, startY: obj.y,
      };
    }
    render();
    return;
  }

  // Start drawing new box
  if (target === document.getElementById('viewport') ||
      target === document.getElementById('bgImage')) {
    selectedId = null;
    drawState = { startX: jx, startY: jy, startPX: px, startPY: py };
    render();
  }
}

function onMouseMove(e) {
  const { px, py, jx, jy } = getCoords(e);

  // Update coords display
  document.getElementById('coordsDisplay').textContent =
    `JSON: (${jx}, ${jy})  |  Screen: (${px}, ${py})`;

  // Handle drag
  if (dragState) {
    const dx = px - dragState.startMX;
    const dy = py - dragState.startMY;
    const djx = Math.round(dx / SCALE_X);
    const djy = Math.round(dy / SCALE_Y);

    if (dragState.type === 'move') {
      const obj = findObject(dragState.id);
      if (obj) {
        const margin = obj.hasSprite ? obj.w : Math.round(obj.w / 2);
        const marginY = obj.hasSprite ? obj.h : Math.round(obj.h / 2);
        obj.x = Math.max(-margin, Math.min(COORD_W, dragState.startX + djx));
        obj.y = Math.max(-marginY, Math.min(COORD_H, dragState.startY + djy));
        render();
        if (selectedSpriteId === dragState.id) renderSpritePanel();
      }
    } else if (dragState.type === 'move-char' && character) {
      character.x = Math.max(0, Math.min(COORD_W, dragState.startX + djx));
      character.y = Math.max(0, Math.min(COORD_H, dragState.startY + djy));
      render();
      renderCharPanel();
    } else if (dragState.type === 'resize-sprite') {
      const obj = findObject(dragState.id);
      if (obj && obj.sprite) {
        const dx = px - dragState.startMX;
        const dy = py - dragState.startMY;
        const corner = dragState.corner;
        let delta = 0;
        if (corner === 'br') delta = Math.max(dx, dy);
        else if (corner === 'bl') delta = Math.max(-dx, dy);
        else if (corner === 'tr') delta = Math.max(dx, -dy);
        else if (corner === 'tl') delta = Math.max(-dx, -dy);

        const fw = obj.sprite.frame_width;
        const origRenderW = fw * dragState.startScale;
        const newRenderW = Math.max(fw * 0.1, origRenderW + delta);
        const newScale = Math.round((newRenderW / fw) * 100) / 100;
        obj.sprite.scale = newScale;
        if (obj.origScale === undefined) obj.origScale = dragState.startScale;
        syncSpriteHitbox(obj);
        render();
        if (selectedSpriteId === dragState.id) renderSpritePanel();
      }
    } else if (dragState.type === 'resize') {
      const obj = findObject(dragState.id);
      if (obj) {
        resizeObject(obj, dragState, djx, djy);
        render();
      }
    }
    updateStatus();
    return;
  }

  // Handle drawing preview
  if (drawState) {
    const preview = document.getElementById('drawPreview');
    const sx = Math.min(drawState.startPX, px);
    const sy = Math.min(drawState.startPY, py);
    const sw = Math.abs(px - drawState.startPX);
    const sh = Math.abs(py - drawState.startPY);
    preview.style.display = 'block';
    preview.style.left = sx + 'px';
    preview.style.top = sy + 'px';
    preview.style.width = sw + 'px';
    preview.style.height = sh + 'px';
  }
}

function onMouseUp(e) {
  if (dragState) {
    dragState = null;
    updateStatus();
    return;
  }

  if (drawState) {
    const { px, py, jx, jy } = getCoords(e);
    const x1 = Math.min(drawState.startX, jx);
    const y1 = Math.min(drawState.startY, jy);
    const w = Math.abs(jx - drawState.startX);
    const h = Math.abs(jy - drawState.startY);

    document.getElementById('drawPreview').style.display = 'none';

    if (w > 5 && h > 5) {
      const id = 'new_box_' + (newBoxes.length + 1);
      newBoxes.push({ id, name: id, x: x1, y: y1, w, h, isNew: true });
      selectedId = id;
      render();
      updateStatus();

      const name = prompt('Name this hotspot (or leave blank):', id);
      if (name) {
        const box = newBoxes.find(b => b.id === id);
        if (box) { box.id = name; box.name = name; selectedId = name; }
        render();
      }
    }
    drawState = null;
  }
}

function onWheel(e) {
  if (!selectedSpriteId) return;
  const obj = findObject(selectedSpriteId);
  if (!obj || !obj.sprite) return;
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.02 : 0.02;
  const newScale = Math.max(0.02, Math.round(((obj.sprite.scale || 1) + delta) * 100) / 100);
  obj.sprite.scale = newScale;
  if (obj.origScale === undefined) obj.origScale = obj.sprite.scale;
  syncSpriteHitbox(obj);
  render();
  renderSpritePanel();
}

function toggleObjShadow(objId, enabled) {
  const obj = objects.find(o => o.id === objId);
  if (!obj) return;
  if (enabled) {
    obj.shadow = { offset_x: 0, offset_y: 2, opacity: 0.7, width: 60, height: 10 };
  } else {
    obj.shadow = null;
  }
  render();
  renderSpritePanel();
  updateStatus();
}

// Shadow slider row: [−] [slider] [+] value. Dragging updates the canvas and the label only;
// re-rendering the panel mid-drag would replace the slider under the cursor.
// `call` is the update function prefix, e.g. "updateCharShadow(" or "updateObjShadow('id',".
function shadowSlider(label, value, min, max, step, call, key, fmt) {
  const lo = Math.min(min, value), hi = Math.max(max, value);
  const fn = call + JSON.stringify(key).replace(/"/g, "'");
  const fmtSrc = fmt.toString().replace(/"/g, '&quot;');
  return `<div class="lbl">${label}:</div><div class="val shadow-row">`
    + `<button class="nudge" onclick="${fn},Math.max(${lo},+(${value}-${step}).toFixed(2)),true)">−</button>`
    + `<input type="range" min="${lo}" max="${hi}" step="${step}" value="${value}" class="shadow-range"`
    + ` oninput="${fn},+this.value,false);this.parentNode.querySelector('.sv').textContent=(${fmtSrc})(+this.value)">`
    + `<button class="nudge" onclick="${fn},Math.min(${hi},+(${value}+${step}).toFixed(2)),true)">+</button>`
    + ` <span class="sv">${fmt(value)}</span></div>`;
}

function updateObjShadow(objId, prop, value, rerenderPanel = true) {
  const obj = objects.find(o => o.id === objId);
  if (!obj || !obj.shadow) return;
  obj.shadow[prop] = value;
  keepPanel = !rerenderPanel;
  render();
  keepPanel = false;
  updateStatus();
}

function toggleCharShadow(enabled) {
  if (!character) return;
  if (enabled) {
    const base = charConfig && charConfig.shadow ? { ...charConfig.shadow } : {};
    character.shadow = { offset_x: base.offset_x ?? 0, offset_y: base.offset_y ?? 2, opacity: base.opacity ?? 0.7, width: base.width ?? 60, height: base.height ?? 10 };
  } else {
    character.shadow = null;
  }
  render();
  renderSpritePanel();
  updateStatus();
}

function updateCharShadow(prop, value, rerenderPanel = true) {
  if (!character || !character.shadow) return;
  character.shadow[prop] = value;
  keepPanel = !rerenderPanel;
  render();
  keepPanel = false;
  updateStatus();
}

function onKeyDown(e) {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selectedId && selectedId !== '__character__') {
      const idx = newBoxes.findIndex(b => b.id === selectedId);
      if (idx >= 0) {
        newBoxes.splice(idx, 1);
        selectedId = null;
        render();
        updateStatus();
      }
    }
  }
  if (e.key === 'Escape') {
    selectedId = null;
    render();
  }
}

// ============================================================
// Helpers
// ============================================================
function findObject(id) {
  if (!id) return null;
  return objects.find(o => o.id === id) || newBoxes.find(b => b.id === id);
}

function selectObject(id) {
  selectedId = id;
  render();
  if (id === '__character__') switchTab('character');
}

function resizeObject(obj, state, djx, djy) {
  const c = state.corner;
  let x = state.startX, y = state.startY, w = state.startW, h = state.startH;
  if (c === 'br') { w += djx; h += djy; }
  if (c === 'bl') { x += djx; w -= djx; h += djy; }
  if (c === 'tr') { y += djy; w += djx; h -= djy; }
  if (c === 'tl') { x += djx; y += djy; w -= djx; h -= djy; }
  if (w < 10) w = 10;
  if (h < 10) h = 10;
  obj.x = Math.max(-Math.round(w / 2), x);
  obj.y = Math.max(-Math.round(h / 2), y);
  obj.w = w;
  obj.h = h;
}

function resetView() {
  if (!currentViewId) return;
  loadView(currentViewId);
}

// ============================================================
// Export
// ============================================================
let exportTabIdx = 0;

function getChanges() {
  const changes = [];

  for (const obj of objects) {
    const scaleChanged = obj.hasSprite && obj.origScale !== undefined && (obj.sprite.scale || 1) !== obj.origScale;
    const shadowChanged = JSON.stringify(obj.shadow || null) !== obj.origShadow;
    if (obj.x !== obj.origX || obj.y !== obj.origY ||
        obj.w !== obj.origW || obj.h !== obj.origH ||
        scaleChanged || shadowChanged) {
      const change = {
        type: 'object',
        id: obj.id,
        name: obj.name,
        position: { x: obj.x, y: obj.y },
        size: { width: obj.w, height: obj.h },
        was: {
          position: { x: obj.origX, y: obj.origY },
          size: { width: obj.origW, height: obj.origH },
        },
      };
      if (scaleChanged) change.scale = obj.sprite.scale;
      if (shadowChanged) change.shadow = obj.shadow;
      changes.push(change);
    }
  }

  const charShadowChanged = character && JSON.stringify(character.shadow || null) !== character.origShadow;
  if (character && (character.x !== character.origX || character.y !== character.origY || charShadowChanged)) {
    const change = {
      type: 'character',
      position: { x: character.x, y: character.y },
      was: { x: character.origX, y: character.origY },
    };
    if (charShadowChanged) change.shadow = character.shadow;
    changes.push(change);
  }

  // Floor outline edited in the Floor tab
  if (typeof floorData !== 'undefined' && floorData) {
    const saved = scenario.views.find(v => v.id === currentViewId)?.walk_area;
    const norm = wa => JSON.stringify({ floor: wa?.floor || [], blocked: (wa?.blocked || []).filter(b => b.length >= 3), depth_scale: wa?.depth_scale || null });
    if (norm(floorData) !== norm(saved)) changes.push({ type: 'floor', walk_area: JSON.parse(`{${floorJson()}}`).walk_area });
  }

  for (const box of newBoxes) {
    changes.push({
      type: 'new',
      id: box.id,
      position: { x: box.x, y: box.y },
      size: { width: box.w, height: box.h },
    });
  }

  return changes;
}

function getExportText(tabIdx) {
  const changes = getChanges();

  if (tabIdx === 0) {
    // Human-readable changes
    let text = `=== HOTSPOT EDITOR EXPORT ===\n`;
    text += `Scenario: ${scenarioId}\n`;
    text += `View: ${currentViewId}\n`;
    text += `Date: ${new Date().toISOString()}\n`;
    text += `Changes: ${changes.length}\n\n`;

    if (changes.length === 0) {
      text += '(no changes)\n';
      return text;
    }

    for (const c of changes) {
      if (c.type === 'object') {
        text += `CHANGED OBJECT: "${c.id}" (${c.name})\n`;
        text += `  position: { x: ${c.was.position.x}, y: ${c.was.position.y} }`;
        text += ` -> { x: ${c.position.x}, y: ${c.position.y} }\n`;
        if (c.size.width !== c.was.size.width || c.size.height !== c.was.size.height) {
          text += `  size: { width: ${c.was.size.width}, height: ${c.was.size.height} }`;
          text += ` -> { width: ${c.size.width}, height: ${c.size.height} }\n`;
        }
        if (c.scale !== undefined) {
          text += `  scale: ${c.scale}\n`;
        }
        if (c.shadow !== undefined) {
          text += `  shadow: ${JSON.stringify(c.shadow)}\n`;
        }
        text += '\n';
      } else if (c.type === 'character') {
        text += `CHANGED CHARACTER:\n`;
        text += `  { x: ${c.was.x}, y: ${c.was.y} } -> { x: ${c.position.x}, y: ${c.position.y} }\n`;
        if (c.shadow !== undefined) {
          text += `  shadow: ${JSON.stringify(c.shadow)}\n`;
        }
        text += '\n';
      } else if (c.type === 'floor') {
        text += `CHANGED FLOOR (replace this view's walk_area):\n${floorJson()}\n\n`;
      } else if (c.type === 'new') {
        text += `NEW HOTSPOT: "${c.id}"\n`;
        text += `  position: { x: ${c.position.x}, y: ${c.position.y} }\n`;
        text += `  size: { width: ${c.size.width}, height: ${c.size.height} }\n\n`;
      }
    }
    return text;

  } else if (tabIdx === 1) {
    // JSON patch
    return JSON.stringify({
      scenario: scenarioId,
      view: currentViewId,
      changes: changes,
    }, null, 2);

  } else {
    // Full view JSON
    const view = scenario.views.find(v => v.id === currentViewId);
    if (!view) return '(no view loaded)';

    const viewCopy = JSON.parse(JSON.stringify(view));

    // Apply position changes to objects
    for (const obj of objects) {
      const scenObj = scenario.objects.find(o => o.id === obj.id);
      if (scenObj) {
        const patched = JSON.parse(JSON.stringify(scenObj));
        patched.position = { x: obj.x, y: obj.y };
        patched.size = { width: obj.w, height: obj.h };
        // Include inline in the export for convenience
        if (!viewCopy._objects) viewCopy._objects = [];
        viewCopy._objects.push(patched);
      }
    }

    // Apply character changes
    if (character && viewCopy.character) {
      viewCopy.character.x = character.x;
      viewCopy.character.y = character.y;
    }

    // Add new boxes
    for (const box of newBoxes) {
      if (!viewCopy._new_objects) viewCopy._new_objects = [];
      viewCopy._new_objects.push({
        id: box.id,
        name: box.name || box.id,
        position: { x: box.x, y: box.y },
        size: { width: box.w, height: box.h },
      });
    }

    return JSON.stringify(viewCopy, null, 2);
  }
}
