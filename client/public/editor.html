<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Editor — Adventure Engine</title>
<style>
  :root {
    --gold: #c0a030;
    --gold-dim: #6a5a3a;
    --bg: #0d0d0a;
    --panel: #151210;
    --border: #2a2018;
    --text: #e0d0a0;
    --text-dim: #8a7a5a;
    --accent-nav: #4488cc;
    --accent-obj: #c0a030;
    --accent-char: #44cc66;
    --accent-new: #cc4444;
    --accent-sprite: #cc88ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 13px;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .toolbar label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .toolbar select, .toolbar button {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 4px 10px;
    font-family: inherit;
    font-size: 12px;
    border-radius: 3px;
    cursor: pointer;
  }
  .toolbar select:hover, .toolbar button:hover { border-color: var(--gold); }
  .toolbar button.primary { background: #2a2210; border-color: var(--gold); color: var(--gold); }
  .toolbar .spacer { flex: 1; }
  .toolbar .coords {
    color: var(--gold);
    font-size: 12px;
    min-width: 180px;
    text-align: right;
  }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Canvas area */
  .canvas-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 16px;
  }
  .viewport {
    position: relative;
    width: 960px;
    height: 540px;
    background: #111;
    border: 1px solid var(--border);
    cursor: crosshair;
    flex-shrink: 0;
    overflow: hidden;
  }
  .viewport img.bg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* Hotspot boxes */
  .hotspot {
    position: absolute;
    border: 2px solid var(--accent-obj);
    background: rgba(192, 160, 48, 0.12);
    cursor: move;
    z-index: 10;
  }
  .hotspot.nav { border-color: var(--accent-nav); background: rgba(68, 136, 204, 0.12); }
  .hotspot.has-sprite { border-color: var(--accent-sprite); background: rgba(204, 136, 255, 0.08); }
  .hotspot.selected { border-width: 3px; z-index: 20; }
  .hotspot.new-box { border-color: var(--accent-new); background: rgba(204, 68, 68, 0.15); border-style: dashed; }
  .hotspot .label {
    position: absolute;
    top: -18px;
    left: 0;
    font-size: 10px;
    color: var(--accent-obj);
    white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 0 3px #000, 0 0 6px #000;
  }
  .hotspot.nav .label { color: var(--accent-nav); }
  .hotspot.has-sprite .label { color: var(--accent-sprite); }
  .hotspot .handle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: var(--gold);
    border: 1px solid #000;
    z-index: 30;
  }
  .hotspot .handle.tl { top: -4px; left: -4px; cursor: nw-resize; }
  .hotspot .handle.tr { top: -4px; right: -4px; cursor: ne-resize; }
  .hotspot .handle.bl { bottom: -4px; left: -4px; cursor: sw-resize; }
  .hotspot .handle.br { bottom: -4px; right: -4px; cursor: se-resize; }

  /* Object sprite overlay */
  .obj-sprite {
    position: absolute;
    cursor: move;
    z-index: 11;
    image-rendering: auto;
    background-repeat: no-repeat;
  }
  .obj-sprite.selected {
    outline: 2px solid var(--accent-sprite);
    outline-offset: 2px;
  }

  /* Character sprite */
  .char-sprite {
    position: absolute;
    cursor: move;
    z-index: 15;
    image-rendering: pixelated;
    background-repeat: no-repeat;
  }
  .char-shadow {
    position: absolute;
    pointer-events: none;
    z-index: 14;
    border-radius: 50%;
  }

  /* Draw preview */
  .draw-preview {
    position: absolute;
    border: 2px dashed var(--accent-new);
    background: rgba(204, 68, 68, 0.1);
    pointer-events: none;
    z-index: 25;
    display: none;
  }

  /* Side panel */
  .panel {
    width: 360px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* Panel tabs */
  .panel-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .panel-tab {
    flex: 1;
    padding: 8px 12px;
    text-align: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .panel-tab:hover { color: var(--text); }
  .panel-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  .panel-content {
    flex: 1;
    overflow-y: auto;
    display: none;
  }
  .panel-content.active { display: flex; flex-direction: column; }

  .panel-section {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .panel-section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gold-dim);
    margin-bottom: 8px;
  }

  /* Object list */
  .obj-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
  }
  .obj-row:hover { background: rgba(192, 160, 48, 0.08); }
  .obj-row.selected { background: rgba(192, 160, 48, 0.15); border: 1px solid var(--border); }
  .obj-row .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .obj-row .dot.obj { background: var(--accent-obj); }
  .obj-row .dot.nav { background: var(--accent-nav); }
  .obj-row .dot.char { background: var(--accent-char); }
  .obj-row .dot.sprite { background: var(--accent-sprite); }
  .obj-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .obj-row .pos { color: var(--text-dim); font-size: 10px; white-space: nowrap; }
  .obj-row .changed { color: var(--accent-new); font-weight: bold; font-size: 10px; }

  /* Character controls */
  .char-controls { display: flex; flex-direction: column; gap: 10px; }
  .char-controls .row { display: flex; align-items: center; gap: 8px; }
  .char-controls label { color: var(--text-dim); font-size: 11px; min-width: 70px; }
  .char-controls select, .char-controls input {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 3px 8px;
    font-family: inherit;
    font-size: 12px;
    border-radius: 3px;
  }
  .char-controls select:hover, .char-controls input:hover { border-color: var(--gold); }

  .facing-btns { display: flex; gap: 4px; }
  .facing-btn {
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 3px 10px;
    font-family: inherit;
    font-size: 11px;
    border-radius: 3px;
    cursor: pointer;
  }
  .facing-btn:hover { border-color: var(--gold); color: var(--text); }
  .facing-btn.active { background: #2a2210; border-color: var(--gold); color: var(--gold); }

  .anim-toggle {
    background: var(--bg);
    color: var(--accent-char);
    border: 1px solid var(--accent-char);
    padding: 4px 14px;
    font-family: inherit;
    font-size: 11px;
    border-radius: 3px;
    cursor: pointer;
  }
  .anim-toggle:hover { background: rgba(68, 204, 102, 0.1); }
  .anim-toggle.paused { color: var(--accent-new); border-color: var(--accent-new); }

  .char-pos-display {
    color: var(--gold);
    font-size: 13px;
    font-weight: bold;
  }

  .sprite-preview-box {
    margin-top: 8px;
    padding: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 120px;
    position: relative;
    overflow: hidden;
  }
  .sprite-preview-box .sprite-el {
    image-rendering: pixelated;
    background-repeat: no-repeat;
  }
  .no-char-msg {
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    padding: 20px;
  }

  /* Export modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--gold);
    border-radius: 6px;
    width: 750px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header h3 { color: var(--gold); font-size: 14px; }
  .modal-body { padding: 16px; flex: 1; overflow-y: auto; }
  .modal textarea {
    width: 100%;
    min-height: 300px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 12px;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    resize: vertical;
    border-radius: 3px;
  }
  .modal-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 12px;
  }
  .modal-tab {
    padding: 6px 16px;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    border: 1px solid var(--border);
    border-bottom: none;
    background: var(--bg);
    margin-right: -1px;
  }
  .modal-tab:first-child { border-radius: 4px 0 0 0; }
  .modal-tab:last-child { border-radius: 0 4px 0 0; }
  .modal-tab.active { color: var(--gold); background: var(--panel); border-bottom: 1px solid var(--panel); }
  .modal-footer {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }

  /* Status bar */
  .statusbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 4px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .statusbar .hint { flex: 1; }
  .statusbar .change-count { color: var(--accent-new); }

  /* Sprite detail panel */
  .sprite-detail { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .sprite-detail-header {
    display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
    font-size: 12px; color: var(--accent-sprite); font-weight: bold;
  }
  .sprite-detail-grid {
    display: grid; grid-template-columns: 80px 1fr; gap: 4px 8px;
    font-size: 11px;
  }
  .sprite-detail-grid .lbl { color: var(--text-dim); }
  .sprite-detail-grid .val { color: var(--text); }
  .sprite-detail-preview {
    margin-top: 8px; padding: 10px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    min-height: 100px; position: relative; overflow: hidden;
  }
  .sprite-detail-preview .sprite-el {
    image-rendering: pixelated; background-repeat: no-repeat;
  }
  .sprite-list-item {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; cursor: pointer; border-radius: 3px; font-size: 11px;
  }
  .sprite-list-item:hover { background: rgba(204, 136, 255, 0.08); }
  .sprite-list-item.active { background: rgba(204, 136, 255, 0.15); border: 1px solid var(--border); }
  .sprite-list-item .sprite-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-sprite); flex-shrink: 0; }
  .sprite-list-item .sprite-dot.char { background: var(--accent-char); }
  .sprite-list-item .sprite-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sprite-list-item .sprite-info { color: var(--text-dim); font-size: 10px; white-space: nowrap; }
</style>
</head>
<body>

<div class="toolbar">
  <label>Scenario</label>
  <select id="scenarioSelect"><option value="">Loading...</option></select>
  <label>View</label>
  <select id="viewSelect"><option value="">Pick scenario first</option></select>
  <label style="margin-left:8px">
    <input type="checkbox" id="showHotspots" checked style="margin-right:4px;vertical-align:middle;">
    Hotspots
  </label>
  <label>
    <input type="checkbox" id="showSprites" checked style="margin-right:4px;vertical-align:middle;">
    Sprites
  </label>
  <div class="spacer"></div>
  <div class="coords" id="coordsDisplay">Move mouse over viewport</div>
  <button onclick="resetView()">Reset View</button>
  <button class="primary" onclick="showExport()">Export Changes</button>
</div>

<div class="main">
  <div class="canvas-wrap">
    <div class="viewport" id="viewport">
      <img class="bg" id="bgImage" src="" alt="background" />
      <div class="draw-preview" id="drawPreview"></div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-tabs">
      <div class="panel-tab active" data-tab="objects" onclick="switchTab('objects')">Objects</div>
      <div class="panel-tab" data-tab="character" onclick="switchTab('character')">Character</div>
      <div class="panel-tab" data-tab="sprites" onclick="switchTab('sprites')">Sprites</div>
    </div>
    <div class="panel-content active" id="tab-objects">
      <div id="objectList" style="padding:8px;"></div>
    </div>
    <div class="panel-content" id="tab-character">
      <div id="charPanel"></div>
    </div>
    <div class="panel-content" id="tab-sprites">
      <div id="spriteList" style="padding:8px;"></div>
      <div id="spriteDetail"></div>
    </div>
  </div>
</div>

<div class="statusbar">
  <div class="hint" id="statusHint">Load a scenario to begin. Click + drag on empty space to draw a new hotspot box.</div>
  <div class="change-count" id="changeCount"></div>
  <div>960x720 coord space | viewport 960x540 | SCALE_Y=0.75</div>
</div>

<!-- Export modal -->
<div class="modal-overlay" id="exportModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Export Changes</h3>
      <button onclick="closeExport()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-tabs">
        <div class="modal-tab active" onclick="switchExportTab(0)">Changes</div>
        <div class="modal-tab" onclick="switchExportTab(1)">JSON Patch</div>
        <div class="modal-tab" onclick="switchExportTab(2)">Full View JSON</div>
      </div>
      <textarea id="exportText" readonly></textarea>
    </div>
    <div class="modal-footer">
      <button onclick="copyExport()">Copy to Clipboard</button>
      <button onclick="closeExport()">Close</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// State
// ============================================================
let scenario = null;
let scenarioId = '';
let currentViewId = '';
let objects = [];       // { id, name, x, y, w, h, isNav, hasSprite, sprite, origX, origY, origW, origH }
let character = null;   // { x, y, origX, origY, facing, sprite_set }
let charConfig = null;  // scenario.character config
let newBoxes = [];      // { id, x, y, w, h } — user-drawn boxes
let selectedId = null;
let selectedSpriteId = null; // for Sprites tab: '__character__' or object ID
let dragState = null;
let drawState = null;

// Animation state
let animPaused = false;
let charAnimFrame = 0;
let charAnimId = 0;
let objAnimFrames = {};  // { objectId: frame }
let objAnimIds = {};     // { objectId: rafId }

// Editor overrides (not from JSON)
let charFacingOverride = null;
let charSpriteSetOverride = null;

const SCALE_X = 1.0;
const SCALE_Y = 0.75;
const VP_W = 960;
const VP_H = 540;
const COORD_W = 960;
const COORD_H = 720;

// ============================================================
// Init
// ============================================================
async function init() {
  try {
    const r = await fetch('/scenarios/manifest.json');
    const ids = await r.json();
    const sel = document.getElementById('scenarioSelect');
    sel.innerHTML = '<option value="">-- Select --</option>' +
      ids.map(id => `<option value="${id}">${id}</option>`).join('');
    sel.onchange = () => loadScenario(sel.value);
  } catch {
    document.getElementById('scenarioSelect').innerHTML =
      '<option value="">Failed to load manifest</option>';
  }

  const vp = document.getElementById('viewport');
  vp.addEventListener('mousedown', onMouseDown);
  vp.addEventListener('mousemove', onMouseMove);
  vp.addEventListener('mouseup', onMouseUp);
  vp.addEventListener('mouseleave', onMouseUp);
  document.addEventListener('keydown', onKeyDown);
  document.getElementById('showHotspots').addEventListener('change', render);
  document.getElementById('showSprites').addEventListener('change', render);
}

// ============================================================
// Scenario / View loading
// ============================================================
async function loadScenario(id) {
  if (!id) return;
  scenarioId = id;
  try {
    const r = await fetch(`/scenarios/${id}/scenario.json`);
    scenario = await r.json();
    charConfig = scenario.character || null;

    const sel = document.getElementById('viewSelect');
    sel.innerHTML = scenario.views.map(v =>
      `<option value="${v.id}">${v.name || v.id}</option>`
    ).join('');
    sel.onchange = () => loadView(sel.value);
    loadView(scenario.views[0].id);
  } catch (e) {
    alert('Failed to load scenario: ' + e.message);
  }
}

function loadView(viewId) {
  cancelAllAnimations();
  currentViewId = viewId;
  const view = scenario.views.find(v => v.id === viewId);
  if (!view) return;

  // Background
  const bgFile = view.background_file || `backgrounds/${view.background_key}.webp`;
  document.getElementById('bgImage').src = `/scenarios/${scenarioId}/${bgFile}`;

  // Objects
  objects = [];
  for (const objId of view.objects) {
    const obj = scenario.objects.find(o => o.id === objId);
    if (!obj) continue;
    const isNav = objId.startsWith('nav_');
    objects.push({
      id: obj.id,
      name: obj.name,
      x: obj.position.x,
      y: obj.position.y,
      w: obj.size.width,
      h: obj.size.height,
      isNav,
      hasSprite: !!obj.sprite,
      sprite: obj.sprite || null,
      origX: obj.position.x,
      origY: obj.position.y,
      origW: obj.size.width,
      origH: obj.size.height,
    });
  }

  // Character
  charFacingOverride = null;
  charSpriteSetOverride = null;
  if (view.character) {
    character = {
      x: view.character.x,
      y: view.character.y,
      facing: view.character.facing || 'down',
      sprite_set: view.character.sprite_set || 'idle',
      frame: view.character.frame,
      origX: view.character.x,
      origY: view.character.y,
    };
  } else {
    character = null;
  }

  newBoxes = [];
  selectedId = null;
  selectedSpriteId = null;
  animPaused = false;
  charAnimFrame = 0;
  objAnimFrames = {};

  render();
  renderCharPanel();
  startAnimations();
  updateStatus();
}

// ============================================================
// Animation management
// ============================================================
function cancelAllAnimations() {
  if (charAnimId) { cancelAnimationFrame(charAnimId); charAnimId = 0; }
  for (const id of Object.values(objAnimIds)) { cancelAnimationFrame(id); }
  objAnimIds = {};
  objAnimFrames = {};
}

function startAnimations() {
  if (animPaused) return;
  startCharAnimation();
  for (const obj of objects) {
    if (obj.hasSprite && obj.sprite.frame_rate > 0) {
      startObjAnimation(obj.id, obj.sprite);
    }
  }
}

function startCharAnimation() {
  if (!character || !charConfig) return;
  const ss = charConfig.sprite_sets[getCharSpriteSet()];
  if (!ss || ss.frame_rate <= 0) return;
  if (character.frame !== undefined) return; // static placement

  let last = 0;
  const interval = 1000 / ss.frame_rate;
  const shouldLoop = ss.loop !== false;

  function tick(time) {
    if (time - last >= interval) {
      last = time;
      charAnimFrame++;
      if (charAnimFrame >= ss.columns) {
        charAnimFrame = shouldLoop ? 0 : ss.columns - 1;
      }
      updateCharSprite();
    }
    charAnimId = requestAnimationFrame(tick);
  }
  charAnimFrame = 0;
  charAnimId = requestAnimationFrame(tick);
}

function startObjAnimation(objId, sprite) {
  let last = 0;
  const interval = 1000 / sprite.frame_rate;
  objAnimFrames[objId] = 0;

  function tick(time) {
    if (time - last >= interval) {
      last = time;
      objAnimFrames[objId] = (objAnimFrames[objId] + 1) % sprite.columns;
      updateObjSprite(objId);
    }
    objAnimIds[objId] = requestAnimationFrame(tick);
  }
  objAnimIds[objId] = requestAnimationFrame(tick);
}

function togglePause() {
  animPaused = !animPaused;
  if (animPaused) {
    cancelAllAnimations();
  } else {
    startAnimations();
  }
  renderCharPanel();
}

function getCharFacing() {
  return charFacingOverride || (character ? character.facing : 'down');
}

function getCharSpriteSet() {
  return charSpriteSetOverride || (character ? character.sprite_set : 'idle');
}

// ============================================================
// Rendering
// ============================================================
function render() {
  const vp = document.getElementById('viewport');
  const showHotspots = document.getElementById('showHotspots').checked;
  const showSprites = document.getElementById('showSprites').checked;

  // Remove old dynamic elements
  vp.querySelectorAll('.hotspot, .char-sprite, .char-shadow, .obj-sprite').forEach(el => el.remove());

  // Render object sprites (behind hotspots)
  if (showSprites) {
    for (const obj of objects) {
      if (!obj.hasSprite) continue;
      renderObjSprite(vp, obj);
    }
  }

  // Render hotspot boxes
  if (showHotspots) {
    for (const obj of [...objects, ...newBoxes]) {
      renderHotspotBox(vp, obj);
    }
  }

  // Render character sprite
  if (showSprites && character && charConfig) {
    renderCharacter(vp);
  }

  renderObjectList();
  renderSpritePanel();
}

function renderHotspotBox(vp, obj) {
  const el = document.createElement('div');
  el.className = 'hotspot' +
    (obj.isNav ? ' nav' : '') +
    (obj.hasSprite ? ' has-sprite' : '') +
    (obj.id === selectedId ? ' selected' : '') +
    (obj.isNew ? ' new-box' : '');
  el.dataset.id = obj.id;

  const sx = obj.x * SCALE_X;
  const sy = obj.y * SCALE_Y;
  const sw = obj.w * SCALE_X;
  const sh = obj.h * SCALE_Y;

  el.style.left = sx + 'px';
  el.style.top = sy + 'px';
  el.style.width = sw + 'px';
  el.style.height = sh + 'px';

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = obj.name || obj.id;
  el.appendChild(label);

  if (obj.id === selectedId) {
    for (const corner of ['tl', 'tr', 'bl', 'br']) {
      const h = document.createElement('div');
      h.className = 'handle ' + corner;
      h.dataset.corner = corner;
      el.appendChild(h);
    }
  }

  vp.appendChild(el);
}

function renderObjSprite(vp, obj) {
  const sp = obj.sprite;
  const fw = sp.frame_width;
  const fh = sp.frame_height;
  const scale = sp.scale || 1;
  const renderW = fw * scale;
  const renderH = fh * scale;
  const screenX = obj.x * SCALE_X + (obj.w * SCALE_X / 2); // center of hotspot
  const screenY = (obj.y + obj.h) * SCALE_Y; // bottom of hotspot
  const sheetW = sp.columns * fw * scale;
  const sheetH = (sp.rows || 1) * fh * scale;
  const frame = objAnimFrames[obj.id] || 0;
  const bgX = -(frame * fw) * scale;

  const el = document.createElement('div');
  el.className = 'obj-sprite' + (selectedSpriteId === obj.id ? ' selected' : '');
  el.dataset.spriteFor = obj.id;
  el.style.left = (screenX - renderW / 2) + 'px';
  el.style.top = (screenY - renderH) + 'px';
  el.style.width = renderW + 'px';
  el.style.height = renderH + 'px';
  el.style.backgroundImage = `url(/scenarios/${scenarioId}/${sp.file})`;
  el.style.backgroundPosition = `${bgX}px 0px`;
  el.style.backgroundSize = `${sheetW}px ${sheetH}px`;

  vp.appendChild(el);
}

function updateObjSprite(objId) {
  const el = document.querySelector(`.obj-sprite[data-sprite-for="${objId}"]`);
  if (!el) return;
  const obj = objects.find(o => o.id === objId);
  if (!obj || !obj.sprite) return;
  const sp = obj.sprite;
  const scale = sp.scale || 1;
  const frame = objAnimFrames[objId] || 0;
  const bgX = -(frame * sp.frame_width) * scale;
  el.style.backgroundPosition = `${bgX}px 0px`;

  if (selectedSpriteId === objId) renderSpriteDetailPreview(objId);
}

function renderCharacter(vp) {
  const ss = charConfig.sprite_sets[getCharSpriteSet()];
  if (!ss) return;

  const fw = charConfig.frame_width;
  const fh = charConfig.frame_height;
  const scale = charConfig.scale || 1;
  const renderW = fw * scale;
  const renderH = fh * scale;
  const screenX = character.x * SCALE_X;
  const screenY = character.y * SCALE_Y;
  const sheetW = ss.columns * fw * scale;
  const sheetH = ss.rows * fh * scale;

  const directions = ss.directions || ['down', 'left', 'right', 'up'];
  const facing = getCharFacing();
  const mirrorFacing = facing === 'left' && !directions.includes('left');
  const effectiveFacing = mirrorFacing ? 'right' : facing;
  const row = Math.max(0, directions.indexOf(effectiveFacing));

  const frame = (character.frame !== undefined) ? character.frame : charAnimFrame;
  const bgX = -(frame * fw) * scale;
  const bgY = -(row * fh) * scale;

  // Shadow
  const shadow = charConfig.shadow;
  if (shadow) {
    const se = document.createElement('div');
    se.className = 'char-shadow';
    const sw = shadow.width || renderW * 0.6;
    const sh = shadow.height || 6;
    se.style.left = (screenX + (shadow.offset_x || 0) * SCALE_X - sw / 2) + 'px';
    se.style.top = (screenY + (shadow.offset_y || 0) * SCALE_Y - sh / 2) + 'px';
    se.style.width = sw + 'px';
    se.style.height = sh + 'px';
    se.style.background = `radial-gradient(ellipse, ${shadow.color || 'rgba(0,0,0,0.5)'} 0%, transparent 70%)`;
    se.style.opacity = shadow.opacity || 0.6;
    vp.appendChild(se);
  }

  // Sprite
  const el = document.createElement('div');
  el.className = 'char-sprite';
  el.dataset.id = '__character__';
  el.style.left = (screenX - renderW / 2) + 'px';
  el.style.top = (screenY - renderH) + 'px';
  el.style.width = renderW + 'px';
  el.style.height = renderH + 'px';
  el.style.backgroundImage = `url(/scenarios/${scenarioId}/${ss.file})`;
  el.style.backgroundPosition = `${bgX}px ${bgY}px`;
  el.style.backgroundSize = `${sheetW}px ${sheetH}px`;
  if (mirrorFacing) {
    el.style.transform = 'scaleX(-1)';
  }

  vp.appendChild(el);
}

function updateCharSprite() {
  const el = document.querySelector('.char-sprite');
  if (!el || !charConfig || !character) return;
  const ss = charConfig.sprite_sets[getCharSpriteSet()];
  if (!ss) return;

  const fw = charConfig.frame_width;
  const fh = charConfig.frame_height;
  const scale = charConfig.scale || 1;

  const directions = ss.directions || ['down', 'left', 'right', 'up'];
  const facing = getCharFacing();
  const mirrorFacing = facing === 'left' && !directions.includes('left');
  const effectiveFacing = mirrorFacing ? 'right' : facing;
  const row = Math.max(0, directions.indexOf(effectiveFacing));

  const frame = charAnimFrame;
  const bgX = -(frame * fw) * scale;
  const bgY = -(row * fh) * scale;

  el.style.backgroundPosition = `${bgX}px ${bgY}px`;
  el.style.transform = mirrorFacing ? 'scaleX(-1)' : '';

  if (selectedSpriteId === '__character__') renderSpriteDetailPreview('__character__');
}

function renderObjectList() {
  const listEl = document.getElementById('objectList');
  let html = '';

  // Character
  if (character) {
    const changed = character.x !== character.origX || character.y !== character.origY;
    html += `<div class="obj-row${selectedId === '__character__' ? ' selected' : ''}"
                  onclick="selectObject('__character__')">
      <div class="dot char"></div>
      <div class="name">Character</div>
      <div class="pos">(${character.x}, ${character.y})</div>
      ${changed ? '<div class="changed">*</div>' : ''}
    </div>`;
  }

  // Objects
  for (const obj of objects) {
    const changed = obj.x !== obj.origX || obj.y !== obj.origY ||
                    obj.w !== obj.origW || obj.h !== obj.origH;
    const dotClass = obj.hasSprite ? 'sprite' : (obj.isNav ? 'nav' : 'obj');
    html += `<div class="obj-row${selectedId === obj.id ? ' selected' : ''}"
                  onclick="selectObject('${obj.id}')">
      <div class="dot ${dotClass}"></div>
      <div class="name" title="${obj.id}">${obj.name || obj.id}</div>
      <div class="pos">(${obj.x},${obj.y}) ${obj.w}x${obj.h}</div>
      ${changed ? '<div class="changed">*</div>' : ''}
    </div>`;
  }

  // New boxes
  for (const box of newBoxes) {
    html += `<div class="obj-row${selectedId === box.id ? ' selected' : ''}"
                  onclick="selectObject('${box.id}')" style="border-left: 2px solid var(--accent-new);">
      <div class="dot" style="background:var(--accent-new)"></div>
      <div class="name">${box.id}</div>
      <div class="pos">(${box.x},${box.y}) ${box.w}x${box.h}</div>
      <div class="changed">NEW</div>
    </div>`;
  }

  listEl.innerHTML = html;
}

// ============================================================
// Character panel
// ============================================================
function renderCharPanel() {
  const panel = document.getElementById('charPanel');

  if (!character || !charConfig) {
    panel.innerHTML = '<div class="no-char-msg">No character placement in this view.</div>';
    return;
  }

  const spriteSets = Object.keys(charConfig.sprite_sets);
  const currentSS = getCharSpriteSet();
  const ss = charConfig.sprite_sets[currentSS];
  const dirs = ss ? (ss.directions || ['down', 'left', 'right', 'up']) : [];
  const allDirs = [...new Set([...dirs, ...(dirs.includes('left') ? [] : dirs.includes('right') ? ['left'] : [])])];
  if (!allDirs.includes('left') && dirs.includes('right')) allDirs.push('left');
  const currentFacing = getCharFacing();

  let html = '';

  // Position
  html += `<div class="panel-section">
    <div class="panel-section-title">Position (960x720)</div>
    <div class="char-controls">
      <div class="row">
        <label>X, Y:</label>
        <span class="char-pos-display">${character.x}, ${character.y}</span>
      </div>
      ${(character.x !== character.origX || character.y !== character.origY)
        ? `<div style="font-size:10px;color:var(--accent-new);margin-top:2px;">was (${character.origX}, ${character.origY})</div>`
        : ''}
    </div>
  </div>`;

  // Sprite Set
  html += `<div class="panel-section">
    <div class="panel-section-title">Sprite Set</div>
    <div class="char-controls">
      <div class="row">
        <select id="charSpriteSetSelect" onchange="onCharSpriteSetChange(this.value)">
          ${spriteSets.map(s => `<option value="${s}"${s === currentSS ? ' selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
      <div style="font-size:10px;color:var(--text-dim);margin-top:2px;">
        ${ss ? `${ss.columns} frames, ${ss.rows} row${ss.rows > 1 ? 's' : ''}, ${ss.frame_rate || 0}fps` : ''}
        ${ss && ss.loop === false ? ', no loop' : ''}
      </div>
    </div>
  </div>`;

  // Facing
  html += `<div class="panel-section">
    <div class="panel-section-title">Facing Direction</div>
    <div class="char-controls">
      <div class="facing-btns">
        ${allDirs.map(d => `<button class="facing-btn${d === currentFacing ? ' active' : ''}" onclick="onCharFacingChange('${d}')">${d}${!dirs.includes(d) ? ' (flip)' : ''}</button>`).join('')}
      </div>
    </div>
  </div>`;

  // Animation control
  html += `<div class="panel-section">
    <div class="panel-section-title">Animation</div>
    <div class="char-controls">
      <div class="row">
        <button class="anim-toggle${animPaused ? ' paused' : ''}" onclick="togglePause()">
          ${animPaused ? '▶ Play' : '⏸ Pause'}
        </button>
        <span style="font-size:11px;color:var(--text-dim);">Frame: ${charAnimFrame}</span>
      </div>
    </div>
  </div>`;

  // Sprite preview
  html += `<div class="panel-section">
    <div class="panel-section-title">Preview</div>
    <div class="sprite-preview-box" id="charPreviewBox"></div>
  </div>`;

  // Config info
  html += `<div class="panel-section">
    <div class="panel-section-title">Config</div>
    <div style="font-size:10px;color:var(--text-dim);line-height:1.6;">
      frame: ${charConfig.frame_width}x${charConfig.frame_height}<br>
      scale: ${charConfig.scale}<br>
      rendered: ${Math.round(charConfig.frame_width * charConfig.scale)}x${Math.round(charConfig.frame_height * charConfig.scale)}px
      ${charConfig.shadow ? `<br>shadow: ${charConfig.shadow.width}x${charConfig.shadow.height}` : ''}
    </div>
  </div>`;

  panel.innerHTML = html;

  // Render sprite preview in the box
  renderCharPreview();
}

function renderCharPreview() {
  const box = document.getElementById('charPreviewBox');
  if (!box || !charConfig || !character) return;
  box.innerHTML = '';

  const ss = charConfig.sprite_sets[getCharSpriteSet()];
  if (!ss) { box.innerHTML = '<span style="color:var(--text-dim);">No sprite set</span>'; return; }

  const fw = charConfig.frame_width;
  const fh = charConfig.frame_height;
  const previewScale = Math.min(1, 100 / fh); // fit ~100px tall
  const renderW = fw * previewScale;
  const renderH = fh * previewScale;
  const sheetW = ss.columns * fw * previewScale;
  const sheetH = ss.rows * fh * previewScale;

  const directions = ss.directions || ['down', 'left', 'right', 'up'];
  const facing = getCharFacing();
  const mirrorFacing = facing === 'left' && !directions.includes('left');
  const effectiveFacing = mirrorFacing ? 'right' : facing;
  const row = Math.max(0, directions.indexOf(effectiveFacing));
  const frame = charAnimFrame;
  const bgX = -(frame * fw) * previewScale;
  const bgY = -(row * fh) * previewScale;

  const el = document.createElement('div');
  el.className = 'sprite-el';
  el.style.width = renderW + 'px';
  el.style.height = renderH + 'px';
  el.style.backgroundImage = `url(/scenarios/${scenarioId}/${ss.file})`;
  el.style.backgroundPosition = `${bgX}px ${bgY}px`;
  el.style.backgroundSize = `${sheetW}px ${sheetH}px`;
  if (mirrorFacing) el.style.transform = 'scaleX(-1)';

  box.appendChild(el);
}

function onCharSpriteSetChange(val) {
  charSpriteSetOverride = val;
  charAnimFrame = 0;
  cancelAllAnimations();
  render();
  if (!animPaused) startAnimations();
  renderCharPanel();
}

function onCharFacingChange(dir) {
  charFacingOverride = dir;
  render();
  renderCharPanel();
}

// ============================================================
// Sprites panel
// ============================================================
function renderSpritePanel() {
  const listEl = document.getElementById('spriteList');
  const detailEl = document.getElementById('spriteDetail');
  if (!listEl || !detailEl) return;

  // Build list of all sprites on this view
  let html = '<div class="panel-section"><div class="panel-section-title">Sprites on this View</div>';

  // Character sprite
  if (character && charConfig) {
    const ss = charConfig.sprite_sets[character.sprite_set || 'idle'];
    html += `<div class="sprite-list-item${selectedSpriteId === '__character__' ? ' active' : ''}"
                  onclick="selectSprite('__character__')">
      <div class="sprite-dot char"></div>
      <div class="sprite-name">Character</div>
      <div class="sprite-info">${charConfig.frame_width}x${charConfig.frame_height} s${charConfig.scale}</div>
    </div>`;
  }

  // Object sprites
  for (const obj of objects) {
    if (!obj.hasSprite) continue;
    const sp = obj.sprite;
    html += `<div class="sprite-list-item${selectedSpriteId === obj.id ? ' active' : ''}"
                  onclick="selectSprite('${obj.id}')">
      <div class="sprite-dot"></div>
      <div class="sprite-name" title="${obj.id}">${obj.name || obj.id}</div>
      <div class="sprite-info">${sp.frame_width}x${sp.frame_height} s${sp.scale || 1}</div>
    </div>`;
  }

  const spriteCount = (character && charConfig ? 1 : 0) + objects.filter(o => o.hasSprite).length;
  if (spriteCount === 0) {
    html += '<div class="no-char-msg">No sprites on this view.</div>';
  }
  html += '</div>';
  listEl.innerHTML = html;

  // Detail panel for selected sprite
  if (!selectedSpriteId) {
    detailEl.innerHTML = '<div class="no-char-msg" style="padding:20px;">Click a sprite to see details.</div>';
    return;
  }

  if (selectedSpriteId === '__character__') {
    renderCharSpriteDetail(detailEl);
  } else {
    const obj = objects.find(o => o.id === selectedSpriteId);
    if (obj && obj.hasSprite) {
      renderObjSpriteDetail(detailEl, obj);
    } else {
      detailEl.innerHTML = '';
    }
  }
}

function renderCharSpriteDetail(el) {
  if (!charConfig || !character) { el.innerHTML = ''; return; }
  const currentSS = getCharSpriteSet();
  const ss = charConfig.sprite_sets[currentSS];
  if (!ss) { el.innerHTML = ''; return; }

  const renderW = Math.round(charConfig.frame_width * charConfig.scale);
  const renderH = Math.round(charConfig.frame_height * charConfig.scale);
  const changed = character.x !== character.origX || character.y !== character.origY;

  let html = '<div class="sprite-detail">';
  html += '<div class="sprite-detail-header">Character Sprite</div>';
  html += '<div class="sprite-detail-grid">';
  html += `<div class="lbl">Position:</div><div class="val" style="color:var(--gold);font-weight:bold;">(${character.x}, ${character.y})${changed ? ' *' : ''}</div>`;
  if (changed) html += `<div class="lbl">Was:</div><div class="val" style="color:var(--accent-new);">(${character.origX}, ${character.origY})</div>`;
  html += `<div class="lbl">Sprite Set:</div><div class="val">${currentSS}</div>`;
  html += `<div class="lbl">Facing:</div><div class="val">${getCharFacing()}</div>`;
  html += `<div class="lbl">File:</div><div class="val" style="word-break:break-all;">${ss.file}</div>`;
  html += `<div class="lbl">Frame Size:</div><div class="val">${charConfig.frame_width} x ${charConfig.frame_height}</div>`;
  html += `<div class="lbl">Scale:</div><div class="val">${charConfig.scale}</div>`;
  html += `<div class="lbl">Rendered:</div><div class="val">${renderW} x ${renderH}px</div>`;
  html += `<div class="lbl">Grid:</div><div class="val">${ss.columns} cols x ${ss.rows} rows</div>`;
  html += `<div class="lbl">Frame Rate:</div><div class="val">${ss.frame_rate || 0} fps</div>`;
  html += `<div class="lbl">Directions:</div><div class="val">${(ss.directions || []).join(', ')}</div>`;
  if (ss.loop === false) html += `<div class="lbl">Loop:</div><div class="val">false (play once)</div>`;
  if (charConfig.shadow) html += `<div class="lbl">Shadow:</div><div class="val">${charConfig.shadow.width}x${charConfig.shadow.height}</div>`;
  html += '</div>';

  // All sprite sets
  const allSets = Object.keys(charConfig.sprite_sets);
  html += '<div style="margin-top:10px;font-size:10px;color:var(--text-dim);">';
  html += '<strong style="color:var(--gold-dim);">All Sprite Sets:</strong><br>';
  for (const name of allSets) {
    const s = charConfig.sprite_sets[name];
    html += `${name === currentSS ? '► ' : '  '}<span style="color:${name === currentSS ? 'var(--accent-char)' : 'var(--text-dim)'}">${name}</span>: ${s.columns}f, ${s.frame_rate || 0}fps, ${s.file.split('/').pop()}<br>`;
  }
  html += '</div>';

  // Preview
  html += '<div class="sprite-detail-preview" id="spriteDetailPreview"></div>';
  html += '</div>';
  el.innerHTML = html;

  // Render preview
  renderSpriteDetailPreview('__character__');
}

function renderObjSpriteDetail(el, obj) {
  const sp = obj.sprite;
  const scale = sp.scale || 1;
  const renderW = Math.round(sp.frame_width * scale);
  const renderH = Math.round(sp.frame_height * scale);
  const totalFrames = sp.columns * (sp.rows || 1);
  const changed = obj.x !== obj.origX || obj.y !== obj.origY || obj.w !== obj.origW || obj.h !== obj.origH;

  let html = '<div class="sprite-detail">';
  html += `<div class="sprite-detail-header">${obj.name || obj.id}</div>`;
  html += '<div class="sprite-detail-grid">';
  html += `<div class="lbl">Object ID:</div><div class="val">${obj.id}</div>`;
  html += `<div class="lbl">Position:</div><div class="val" style="color:var(--gold);font-weight:bold;">(${obj.x}, ${obj.y})${changed ? ' *' : ''}</div>`;
  if (changed) html += `<div class="lbl">Was:</div><div class="val" style="color:var(--accent-new);">(${obj.origX}, ${obj.origY}) ${obj.origW}x${obj.origH}</div>`;
  html += `<div class="lbl">Hotspot:</div><div class="val">${obj.w} x ${obj.h}</div>`;
  html += `<div class="lbl">File:</div><div class="val" style="word-break:break-all;">${sp.file}</div>`;
  html += `<div class="lbl">Frame Size:</div><div class="val">${sp.frame_width} x ${sp.frame_height}</div>`;
  html += `<div class="lbl">Scale:</div><div class="val">${scale}</div>`;
  html += `<div class="lbl">Rendered:</div><div class="val">${renderW} x ${renderH}px</div>`;
  html += `<div class="lbl">Grid:</div><div class="val">${sp.columns} cols x ${sp.rows || 1} rows</div>`;
  html += `<div class="lbl">Frame Rate:</div><div class="val">${sp.frame_rate || 0} fps</div>`;
  html += `<div class="lbl">Total Frames:</div><div class="val">${totalFrames}</div>`;
  html += `<div class="lbl">Anchor:</div><div class="val">bottom-center of hotspot</div>`;
  html += '</div>';

  // Preview
  html += '<div class="sprite-detail-preview" id="spriteDetailPreview"></div>';
  html += '</div>';
  el.innerHTML = html;

  renderSpriteDetailPreview(obj.id);
}

function renderSpriteDetailPreview(id) {
  const box = document.getElementById('spriteDetailPreview');
  if (!box) return;
  box.innerHTML = '';

  if (id === '__character__') {
    if (!charConfig || !character) return;
    const ss = charConfig.sprite_sets[getCharSpriteSet()];
    if (!ss) return;
    const fw = charConfig.frame_width;
    const fh = charConfig.frame_height;
    const previewScale = Math.min(1.5, 120 / fh);
    const rw = fw * previewScale;
    const rh = fh * previewScale;
    const sw = ss.columns * fw * previewScale;
    const sh = ss.rows * fh * previewScale;
    const dirs = ss.directions || ['down','left','right','up'];
    const facing = getCharFacing();
    const mirror = facing === 'left' && !dirs.includes('left');
    const eff = mirror ? 'right' : facing;
    const row = Math.max(0, dirs.indexOf(eff));
    const frame = charAnimFrame;
    const bgX = -(frame * fw) * previewScale;
    const bgY = -(row * fh) * previewScale;

    const el = document.createElement('div');
    el.className = 'sprite-el';
    el.style.width = rw + 'px';
    el.style.height = rh + 'px';
    el.style.backgroundImage = `url(/scenarios/${scenarioId}/${ss.file})`;
    el.style.backgroundPosition = `${bgX}px ${bgY}px`;
    el.style.backgroundSize = `${sw}px ${sh}px`;
    if (mirror) el.style.transform = 'scaleX(-1)';
    box.appendChild(el);
  } else {
    const obj = objects.find(o => o.id === id);
    if (!obj || !obj.sprite) return;
    const sp = obj.sprite;
    const fw = sp.frame_width;
    const fh = sp.frame_height;
    const previewScale = Math.min(1.5, 120 / fh);
    const rw = fw * previewScale;
    const rh = fh * previewScale;
    const sw = sp.columns * fw * previewScale;
    const sh = (sp.rows || 1) * fh * previewScale;
    const frame = objAnimFrames[id] || 0;
    const bgX = -(frame * fw) * previewScale;

    const el = document.createElement('div');
    el.className = 'sprite-el';
    el.style.width = rw + 'px';
    el.style.height = rh + 'px';
    el.style.backgroundImage = `url(/scenarios/${scenarioId}/${sp.file})`;
    el.style.backgroundPosition = `${bgX}px 0px`;
    el.style.backgroundSize = `${sw}px ${sh}px`;
    box.appendChild(el);
  }
}

function selectSprite(id) {
  selectedSpriteId = id;
  selectedId = id;
  render();
  renderSpritePanel();
}

// ============================================================
// Panel tabs
// ============================================================
function switchTab(tab) {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.panel-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + tab));
}

// ============================================================
// Mouse interactions
// ============================================================
function getCoords(e) {
  const vp = document.getElementById('viewport');
  const rect = vp.getBoundingClientRect();
  const px = Math.round(e.clientX - rect.left);
  const py = Math.round(e.clientY - rect.top);
  const jx = Math.round(px / SCALE_X);
  const jy = Math.round(py / SCALE_Y);
  return { px, py, jx, jy };
}

function onMouseDown(e) {
  const { px, py, jx, jy } = getCoords(e);
  const target = e.target;

  // Handle resize
  if (target.classList.contains('handle')) {
    e.preventDefault();
    const corner = target.dataset.corner;
    const obj = findObject(selectedId);
    if (obj) {
      dragState = {
        type: 'resize',
        corner,
        id: selectedId,
        startMX: px, startMY: py,
        startX: obj.x, startY: obj.y,
        startW: obj.w, startH: obj.h,
      };
    }
    return;
  }

  // Handle character sprite drag
  const charSprite = target.closest('.char-sprite');
  if (charSprite && character) {
    e.preventDefault();
    selectedId = '__character__';
    selectedSpriteId = '__character__';
    dragState = {
      type: 'move-char',
      id: '__character__',
      startMX: px, startMY: py,
      startX: character.x, startY: character.y,
    };
    render();
    renderSpritePanel();
    switchTab('sprites');
    return;
  }

  // Handle object sprite drag
  const objSprite = target.closest('.obj-sprite');
  if (objSprite) {
    e.preventDefault();
    const objId = objSprite.dataset.spriteFor;
    selectedId = objId;
    selectedSpriteId = objId;
    const obj = objects.find(o => o.id === objId);
    if (obj) {
      dragState = {
        type: 'move',
        id: objId,
        startMX: px, startMY: py,
        startX: obj.x, startY: obj.y,
      };
    }
    render();
    renderSpritePanel();
    switchTab('sprites');
    return;
  }

  // Handle hotspot drag
  const hotspot = target.closest('.hotspot');
  if (hotspot) {
    e.preventDefault();
    const id = hotspot.dataset.id;
    selectedId = id;
    const obj = findObject(id);
    if (obj) {
      dragState = {
        type: 'move',
        id,
        startMX: px, startMY: py,
        startX: obj.x, startY: obj.y,
      };
    }
    render();
    return;
  }

  // Start drawing new box
  if (target === document.getElementById('viewport') ||
      target === document.getElementById('bgImage')) {
    selectedId = null;
    drawState = { startX: jx, startY: jy, startPX: px, startPY: py };
    render();
  }
}

function onMouseMove(e) {
  const { px, py, jx, jy } = getCoords(e);

  // Update coords display
  document.getElementById('coordsDisplay').textContent =
    `JSON: (${jx}, ${jy})  |  Screen: (${px}, ${py})`;

  // Handle drag
  if (dragState) {
    const dx = px - dragState.startMX;
    const dy = py - dragState.startMY;
    const djx = Math.round(dx / SCALE_X);
    const djy = Math.round(dy / SCALE_Y);

    if (dragState.type === 'move') {
      const obj = findObject(dragState.id);
      if (obj) {
        obj.x = Math.max(0, Math.min(COORD_W - obj.w, dragState.startX + djx));
        obj.y = Math.max(0, Math.min(COORD_H - obj.h, dragState.startY + djy));
        render();
        if (selectedSpriteId === dragState.id) renderSpritePanel();
      }
    } else if (dragState.type === 'move-char' && character) {
      character.x = Math.max(0, Math.min(COORD_W, dragState.startX + djx));
      character.y = Math.max(0, Math.min(COORD_H, dragState.startY + djy));
      render();
      renderCharPanel();
    } else if (dragState.type === 'resize') {
      const obj = findObject(dragState.id);
      if (obj) {
        resizeObject(obj, dragState, djx, djy);
        render();
      }
    }
    updateStatus();
    return;
  }

  // Handle drawing preview
  if (drawState) {
    const preview = document.getElementById('drawPreview');
    const sx = Math.min(drawState.startPX, px);
    const sy = Math.min(drawState.startPY, py);
    const sw = Math.abs(px - drawState.startPX);
    const sh = Math.abs(py - drawState.startPY);
    preview.style.display = 'block';
    preview.style.left = sx + 'px';
    preview.style.top = sy + 'px';
    preview.style.width = sw + 'px';
    preview.style.height = sh + 'px';
  }
}

function onMouseUp(e) {
  if (dragState) {
    dragState = null;
    updateStatus();
    return;
  }

  if (drawState) {
    const { px, py, jx, jy } = getCoords(e);
    const x1 = Math.min(drawState.startX, jx);
    const y1 = Math.min(drawState.startY, jy);
    const w = Math.abs(jx - drawState.startX);
    const h = Math.abs(jy - drawState.startY);

    document.getElementById('drawPreview').style.display = 'none';

    if (w > 5 && h > 5) {
      const id = 'new_box_' + (newBoxes.length + 1);
      newBoxes.push({ id, name: id, x: x1, y: y1, w, h, isNew: true });
      selectedId = id;
      render();
      updateStatus();

      const name = prompt('Name this hotspot (or leave blank):', id);
      if (name) {
        const box = newBoxes.find(b => b.id === id);
        if (box) { box.id = name; box.name = name; selectedId = name; }
        render();
      }
    }
    drawState = null;
  }
}

function onKeyDown(e) {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selectedId && selectedId !== '__character__') {
      const idx = newBoxes.findIndex(b => b.id === selectedId);
      if (idx >= 0) {
        newBoxes.splice(idx, 1);
        selectedId = null;
        render();
        updateStatus();
      }
    }
  }
  if (e.key === 'Escape') {
    selectedId = null;
    render();
  }
}

// ============================================================
// Helpers
// ============================================================
function findObject(id) {
  if (!id) return null;
  return objects.find(o => o.id === id) || newBoxes.find(b => b.id === id);
}

function selectObject(id) {
  selectedId = id;
  render();
  if (id === '__character__') switchTab('character');
}

function resizeObject(obj, state, djx, djy) {
  const c = state.corner;
  let x = state.startX, y = state.startY, w = state.startW, h = state.startH;
  if (c === 'br') { w += djx; h += djy; }
  if (c === 'bl') { x += djx; w -= djx; h += djy; }
  if (c === 'tr') { y += djy; w += djx; h -= djy; }
  if (c === 'tl') { x += djx; y += djy; w -= djx; h -= djy; }
  if (w < 10) w = 10;
  if (h < 10) h = 10;
  obj.x = Math.max(0, x);
  obj.y = Math.max(0, y);
  obj.w = w;
  obj.h = h;
}

function resetView() {
  if (!currentViewId) return;
  loadView(currentViewId);
}

// ============================================================
// Export
// ============================================================
let exportTabIdx = 0;

function getChanges() {
  const changes = [];

  for (const obj of objects) {
    if (obj.x !== obj.origX || obj.y !== obj.origY ||
        obj.w !== obj.origW || obj.h !== obj.origH) {
      changes.push({
        type: 'object',
        id: obj.id,
        name: obj.name,
        position: { x: obj.x, y: obj.y },
        size: { width: obj.w, height: obj.h },
        was: {
          position: { x: obj.origX, y: obj.origY },
          size: { width: obj.origW, height: obj.origH },
        },
      });
    }
  }

  if (character && (character.x !== character.origX || character.y !== character.origY)) {
    changes.push({
      type: 'character',
      position: { x: character.x, y: character.y },
      was: { x: character.origX, y: character.origY },
    });
  }

  for (const box of newBoxes) {
    changes.push({
      type: 'new',
      id: box.id,
      position: { x: box.x, y: box.y },
      size: { width: box.w, height: box.h },
    });
  }

  return changes;
}

function getExportText(tabIdx) {
  const changes = getChanges();

  if (tabIdx === 0) {
    // Human-readable changes
    let text = `=== HOTSPOT EDITOR EXPORT ===\n`;
    text += `Scenario: ${scenarioId}\n`;
    text += `View: ${currentViewId}\n`;
    text += `Date: ${new Date().toISOString()}\n`;
    text += `Changes: ${changes.length}\n\n`;

    if (changes.length === 0) {
      text += '(no changes)\n';
      return text;
    }

    for (const c of changes) {
      if (c.type === 'object') {
        text += `MOVED OBJECT: "${c.id}" (${c.name})\n`;
        text += `  position: { x: ${c.was.position.x}, y: ${c.was.position.y} }`;
        text += ` -> { x: ${c.position.x}, y: ${c.position.y} }\n`;
        if (c.size.width !== c.was.size.width || c.size.height !== c.was.size.height) {
          text += `  size: { width: ${c.was.size.width}, height: ${c.was.size.height} }`;
          text += ` -> { width: ${c.size.width}, height: ${c.size.height} }\n`;
        }
        text += '\n';
      } else if (c.type === 'character') {
        text += `MOVED CHARACTER:\n`;
        text += `  { x: ${c.was.x}, y: ${c.was.y} } -> { x: ${c.position.x}, y: ${c.position.y} }\n\n`;
      } else if (c.type === 'new') {
        text += `NEW HOTSPOT: "${c.id}"\n`;
        text += `  position: { x: ${c.position.x}, y: ${c.position.y} }\n`;
        text += `  size: { width: ${c.size.width}, height: ${c.size.height} }\n\n`;
      }
    }
    return text;

  } else if (tabIdx === 1) {
    // JSON patch
    return JSON.stringify({
      scenario: scenarioId,
      view: currentViewId,
      changes: changes,
    }, null, 2);

  } else {
    // Full view JSON
    const view = scenario.views.find(v => v.id === currentViewId);
    if (!view) return '(no view loaded)';

    const viewCopy = JSON.parse(JSON.stringify(view));

    // Apply position changes to objects
    for (const obj of objects) {
      const scenObj = scenario.objects.find(o => o.id === obj.id);
      if (scenObj) {
        const patched = JSON.parse(JSON.stringify(scenObj));
        patched.position = { x: obj.x, y: obj.y };
        patched.size = { width: obj.w, height: obj.h };
        // Include inline in the export for convenience
        if (!viewCopy._objects) viewCopy._objects = [];
        viewCopy._objects.push(patched);
      }
    }

    // Apply character changes
    if (character && viewCopy.character) {
      viewCopy.character.x = character.x;
      viewCopy.character.y = character.y;
    }

    // Add new boxes
    for (const box of newBoxes) {
      if (!viewCopy._new_objects) viewCopy._new_objects = [];
      viewCopy._new_objects.push({
        id: box.id,
        name: box.name || box.id,
        position: { x: box.x, y: box.y },
        size: { width: box.w, height: box.h },
      });
    }

    return JSON.stringify(viewCopy, null, 2);
  }
}

function showExport() {
  exportTabIdx = 0;
  document.getElementById('exportText').value = getExportText(0);
  document.getElementById('exportModal').classList.add('active');
  updateExportTabs();
}

function switchExportTab(idx) {
  exportTabIdx = idx;
  document.getElementById('exportText').value = getExportText(idx);
  updateExportTabs();
}

function updateExportTabs() {
  document.querySelectorAll('.modal-tab').forEach((t, i) =>
    t.classList.toggle('active', i === exportTabIdx));
}

function closeExport() {
  document.getElementById('exportModal').classList.remove('active');
}

function copyExport() {
  const textarea = document.getElementById('exportText');
  textarea.select();
  navigator.clipboard.writeText(textarea.value).then(() => {
    const btn = document.querySelector('.modal-footer button');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy to Clipboard'; }, 1500);
  });
}

function updateStatus() {
  const changes = getChanges();
  const count = changes.length;
  document.getElementById('changeCount').textContent =
    count > 0 ? `${count} change${count > 1 ? 's' : ''}` : '';
  document.getElementById('statusHint').textContent =
    selectedId
      ? (selectedId === '__character__'
          ? 'Drag character sprite to reposition. Use Sprites tab for details, Character tab for facing/animation.'
          : `Selected: ${selectedId}. Drag to move, corners to resize. Sprites tab shows sprite details.`)
      : 'Click + drag on empty space to draw a new hotspot. Click a sprite or hotspot to select it.';
}

// ============================================================
// Boot
// ============================================================
init();
</script>
